    radial-gradient(700px 520px at 50% 110%,rgba(16,185,129,.18),transparent),
    linear-gradient(180deg,#0b1f3a 0%,#06111e 45%,#02070e 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,black,transparent 78%);
  mask-image:linear-gradient(180deg,black,transparent 78%);
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;pointer-events:none;animation:float 9s ease-in-out infinite alternate}
@media(max-width:480px){.orb{animation:none}}
@keyframes float{from{transform:translateY(-14px)}to{transform:translateY(16px)}}

.wrapper{max-width:1240px;margin:0 auto;display:flex;gap:28px;justify-content:center;padding:20px 14px 40px;align-items:flex-start}

.phone-container{
  width:100%;max-width:452px;margin:0 auto;background:#f8fafc;min-height:94dvh;position:relative;
  box-shadow:0 30px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14);
  border-radius:32px;overflow:hidden;display:flex;flex-direction:column;
}
@media(max-width:480px){
  .wrapper{padding:0}
  .phone-container{border-radius:0;min-height:100dvh;max-width:100%;box-shadow:none}
}

.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;min-height:64px;gap:8px;
}
#mainContent{flex:1;padding-bottom:10px}

.jgm-brand-trigger{
  font-weight:900;font-size:24px;letter-spacing:-.04em;
  background:linear-gradient(135deg,#0b1f3a 0%,#1e40af 50%,#f59e0b 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:900;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:999px;padding:3px 8px;color:#0b1f3a;white-space:nowrap}
.live-badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin:12px;box-shadow:var(--shadow);animation:fadeUp .32s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-banner{background:linear-gradient(135deg,#071527 0%,#0f274a 55%,#183e75 100%);color:#fff;border:1px solid rgba(245,158,11,.35);position:relative;overflow:hidden}
.card-banner::after{content:'';position:absolute;top:-60px;right:-60px;width:190px;height:190px;background:radial-gradient(circle,rgba(245,158,11,.32),transparent 70%);pointer-events:none}
.card-title{font-weight:900;font-size:13px;color:#0b1f3a;margin:0 0 8px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#0b1f3a 0%,#1e3a8a 100%);color:#fff;border:none;
  border-radius:12px;padding:12px 18px;font-weight:800;font-size:13px;cursor:pointer;
  box-shadow:0 4px 14px rgba(11,31,58,.2);transition:transform .18s,opacity .18s,box-shadow .18s;width:100%;font-family:inherit;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,31,58,.26)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.35)}
.btn.green{background:linear-gradient(135deg,#10b981,#059669)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn.ghost{background:#f1f5f9;color:#0b1f3a;box-shadow:none;border:1px solid #cbd5e1}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px;width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form-label{font-weight:800;font-size:11px;color:#334155;display:block;margin:10px 0 5px;letter-spacing:.02em}
input,select,textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid #cbd5e1;background:#fff;
  font-weight:600;font-size:13px;color:#0f172a;transition:.15s;font-family:inherit;
}
input:focus,select:focus{outline:none;border-color:#1e40af;box-shadow:0 0 0 3px rgba(30,64,175,.14)}
.err-line{color:#ef4444;font-size:11px;font-weight:700;margin-top:8px;min-height:16px}
.hint{font-size:11px;color:#64748b;line-height:1.65}

.bottomnav{
  position:sticky;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid #e2e8f0;display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(0,0,0,.06);
}
.navitem{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 2px 9px;cursor:pointer;color:#94a3b8;font-weight:700;font-size:9.5px;position:relative;font-family:inherit;
  transition:color .18s,transform .18s;
}
.navitem:hover{color:#0b1f3a;transform:translateY(-2px)}
.navitem svg{width:20px;height:20px}
.navitem.active{color:#0b1f3a;font-weight:800}
.navitem.active::before{content:'';position:absolute;top:0;width:26px;height:3.5px;border-radius:0 0 5px 5px;background:#f59e0b;animation:navPop .3s ease}
@keyframes navPop{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
.nav-dot{position:absolute;top:6px;right:50%;transform:translateX(16px);background:#ef4444;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.badge.pending{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.badge.approved{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.badge.rejected{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}

.live-dot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:ripple 1.6s infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

.shimmer-btn{position:relative;overflow:hidden}
.shimmer-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.28) 50%,transparent 80%);animation:shim 2.6s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.task-progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.task-progress div{height:100%;background:linear-gradient(90deg,#10b981,#059669);transition:width .5s cubic-bezier(.16,1,.3,1)}
.countdown{font-variant-numeric:tabular-nums;font-weight:900;font-size:26px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 12px rgba(245,158,11,.45)}

.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px}
.quick-tile{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:700;font-size:9.5px;color:#1e293b;transition:.18s;font-family:inherit}
.quick-tile:active{transform:scale(.96)}
.quick-tile:hover{box-shadow:0 6px 18px rgba(11,31,58,.1);transform:translateY(-3px)}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stat-cell{background:#fff;padding:10px 4px;border-radius:12px;border:1px solid #fed7aa}
.stat-cell b{display:block;font-weight:900;font-size:14px}
.stat-cell span{font-size:9.5px;color:#64748b;font-weight:700}

.row-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #e2e8f0}
.row-item:last-child{border-bottom:none}
.empty-state{text-align:center;color:#94a3b8;font-weight:700;font-size:12px;padding:22px 0}

.secure-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.13);border:1px solid rgba(16,185,129,.32);color:#6ee7b7;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px}

.modal-overlay{position:fixed;inset:0;background:rgba(3,8,16,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-overlay[hidden]{display:none}
.modal{background:#fff;border-radius:24px;max-width:430px;width:100%;padding:22px;max-height:88dvh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}

#toasts{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:380px;pointer-events:none}
.toast{background:#0b1f3a;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .2s ease;text-align:center;border:1px solid rgba(255,255,255,.12);max-width:100%}
.toast.ok{background:#059669}.toast.err{background:#dc2626}.toast.warn{background:#d97706}

.guide-\boxed{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:12px;line-height:1.75;color:#334155}
.guide-box b{color:#0b1f3a}

.spin-\boxed{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 20px;color:#64748b;font-weight:800;font-size:13px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #e2e8f0;border-top-color:#f59e0b;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0b1f3a,#1e40af);color:#fbbf24;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;cursor:pointer;border:2px solid #f59e0b;flex:0 0 auto;transition:transform .2s}
.avatar:hover{transform:scale(1.08) rotate(4deg)}
.tiny{font-size:10px;color:#94a3b8}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{border-top:1px dashed #cbd5e1;margin:14px 0}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.mt8{margin-top:8px}.mt12{margin-top:12px}

.filter-tabs{display:flex;gap:6px;padding:0 12px 6px}
.filter-tabs button{flex:1;border:1.5px solid #e2e8f0;background:#fff;border-radius:10px;padding:7px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;color:#64748b;transition:.18s}
.filter-tabs button:hover{border-color:#0b1f3a;color:#0b1f3a}
.filter-tabs button.on{background:#0b1f3a;color:#fbbf24;border-color:#0b1f3a}

.searchbar{margin:0 12px 8px;position:relative}
.searchbar input{padding-left:36px}
.searchbar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}

.fade-swap{animation:swapIn .32s cubic-bezier(.16,1,.3,1)}
@keyframes swapIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}

/* ===================== IVy THEME — user side only (body.ivy-admin keeps the original admin look) ===================== */
body:not(.ivy-admin){
  --iv-em:#2f5bff;--iv-em2:#5b7bff;--iv-deep:#0b1230;--iv-mint:#e6ecff;--iv-gold:#8b7bff;--iv-gold2:#c9c0ff;
  --iv-ivory:#f4f6fc;--iv-surf:#ffffff;--iv-line:#e3e7f4;--iv-ink:#0e1530;--iv-mute:#6b7391;
  --primary:#2f5bff;--accent:#8b7bff;--bg:#f4f6fc;--surface:#ffffff;--border:#e3e7f4;--text:#0e1530;--muted:#6b7391;--ok:#5b7bff;
  --shadow:0 8px 24px rgba(11,18,48,.08);
  background:#e8ecf8;color:var(--iv-ink);
  font-family:'Sora','Noto Sans Bengali','Plus Jakarta Sans',system-ui,sans-serif;
}
body:not(.ivy-admin)::before{background:radial-gradient(900px 520px at 0% 0%,rgba(91,123,255,.28),transparent),radial-gradient(800px 500px at 100% 100%,rgba(139,123,255,.22),transparent),linear-gradient(180deg,#eef1fb,#e3e8f6)}
body:not(.ivy-admin)::after{background-image:radial-gradient(rgba(47,91,255,.10) 1px,transparent 1px)}
body:not(.ivy-admin) .orb{display:none}
body:not(.ivy-admin) .phone-container{background:var(--iv-ivory);box-shadow:0 24px 70px rgba(11,18,48,.22),0 0 0 1px rgba(47,91,255,.10)}

/* logo */
.ivy-logo{display:inline-flex;align-items:center;gap:calc(var(--s,30px)*.28);cursor:pointer;user-select:none}
.ivy-mark{width:var(--s,30px);height:var(--s,30px);flex:none}
.ivy-mark rect{fill:#2f5bff}.ivy-mark path:nth-of-type(1){fill:#c9c0ff}.ivy-mark path:nth-of-type(2){stroke:#2f5bff;stroke-width:2.4;stroke-linecap:round}
.ivy-word{font-family:'Sora',sans-serif;font-weight:800;font-size:calc(var(--s,30px)*.78);letter-spacing:-.03em;color:#2f5bff;line-height:1}
.ivy-word b{color:#8b7bff;font-weight:800}

/* top bar */
body:not(.ivy-admin) .topbar{background:rgba(244,246,252,.94);border-bottom:1px solid var(--iv-line);min-height:60px}
body:not(.ivy-admin) .phone-container.auth-mode .topbar{display:none}
.ivy-tb-right{display:flex;align-items:center;gap:10px}
.ivy-tb-bal{border:1px solid var(--iv-line);background:var(--iv-surf);color:var(--iv-em);font:800 12px 'Sora',sans-serif;border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
body:not(.ivy-admin) .avatar{background:linear-gradient(135deg,#2f5bff,#5b7bff);color:var(--iv-gold2);border:0;cursor:pointer;width:38px;height:38px}

/* shared components */
body:not(.ivy-admin) .card{background:var(--iv-surf);border:1px solid var(--iv-line);border-radius:22px;box-shadow:var(--shadow)}
body:not(.ivy-admin) .card-banner{background:linear-gradient(140deg,#0b1230,#2f5bff 60%,#5b7bff);border:0;color:#fff}
body:not(.ivy-admin) .card-banner::after{background:radial-gradient(circle,rgba(201,192,255,.35),transparent 70%)}
body:not(.ivy-admin) .card-title{color:var(--iv-deep)}
body:not(.ivy-admin) .btn{background:linear-gradient(135deg,#2f5bff,#5b7bff);border-radius:14px;box-shadow:0 6px 16px rgba(47,91,255,.22);min-height:44px}
body:not(.ivy-admin) .btn.gold{background:linear-gradient(135deg,#4a4dff,#8b7bff);color:#ffffff;box-shadow:0 6px 16px rgba(139,123,255,.35)}
body:not(.ivy-admin) .btn.ghost{background:transparent;color:var(--iv-em);border:1.5px solid rgba(47,91,255,.35);box-shadow:none}
body:not(.ivy-admin) .btn.sm{min-height:38px}
body:not(.ivy-admin) .shimmer-btn::after{display:none}
body:not(.ivy-admin) .form-label{color:var(--iv-deep);font-weight:700}
body:not(.ivy-admin) input,body:not(.ivy-admin) select,body:not(.ivy-admin) textarea{border-radius:14px;border:1.5px solid var(--iv-line);background:#fff;color:var(--iv-ink)}
body:not(.ivy-admin) input:focus,body:not(.ivy-admin) select:focus,body:not(.ivy-admin) textarea:focus{border-color:var(--iv-em2);outline:3px solid rgba(91,123,255,.18)}
body:not(.ivy-admin) :focus-visible{outline:3px solid rgba(139,123,255,.7);outline-offset:2px}
body:not(.ivy-admin) .task-progress{background:#e3e7f4;height:9px}
body:not(.ivy-admin) .task-progress div{background:linear-gradient(90deg,#5b7bff,#8b7bff)}
body:not(.ivy-admin) .badge{border-radius:999px}
body:not(.ivy-admin) .badge.pending{background:#fbf1d8;color:#8a6a1f;border-color:#ecd9a4}
body:not(.ivy-admin) .badge.approved{background:#e6ecff;color:#2f5bff;border-color:#b9c8ff}
body:not(.ivy-admin) .stat-cell,body:not(.ivy-admin) .quick-tile{background:var(--iv-surf);border-color:var(--iv-line)}
body:not(.ivy-admin) .row-item{border-bottom-color:var(--iv-line)}
body:not(.ivy-admin) #modalBox{border-radius:26px;background:var(--iv-surf)}
body:not(.ivy-admin) #modalBox h3{color:var(--iv-deep)!important}
body:not(.ivy-admin) .toast{border-radius:14px}
body:not(.ivy-admin) .live-badge{background:var(--iv-mint);border-color:#b9c8ff;color:var(--iv-deep)}

/* bottom nav → floating pill */
body:not(.ivy-admin) .bottomnav{margin:0 12px calc(10px + env(safe-area-inset-bottom));padding-bottom:0;background:var(--iv-deep);border:0;border-radius:24px;box-shadow:0 14px 30px rgba(11,18,48,.35);overflow:hidden}
body:not(.ivy-admin) .navitem{color:rgba(255,255,255,.62);min-height:56px;padding:9px 2px 8px;font-size:10px}
body:not(.ivy-admin) .navitem:hover{color:#fff}
body:not(.ivy-admin) .navitem.active{color:var(--iv-gold2)}
body:not(.ivy-admin) .navitem.active::before{top:auto;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--iv-gold)}
body:not(.ivy-admin) .navitem svg{width:21px;height:21px}
body:not(.ivy-admin) .nav-dot{background:var(--iv-gold);color:#ffffff}

/* auth */
.ivy-auth{min-height:100%}
.ivy-auth-hero{background:linear-gradient(160deg,#0b1230,#2f5bff 70%,#5b7bff);padding:44px 20px 64px;text-align:center;color:#fff;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.ivy-auth-hero::after{content:'';position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(201,192,255,.4),transparent 70%)}
.ivy-auth-hero .ivy-word{color:#fff}.ivy-auth-hero .ivy-word b{color:var(--iv-gold2)}
.ivy-auth-hero p{margin:12px 0 0;font-size:12.5px;color:#c9d4ff;position:relative;z-index:1}
.ivy-auth-sheet{background:var(--iv-surf);margin:-34px 14px 18px;border-radius:24px;padding:22px 18px;border:1px solid var(--iv-line);box-shadow:var(--shadow);position:relative;z-index:2}
.ivy-auth-sheet h2{margin:0;font-size:21px;font-weight:800;color:var(--iv-deep)}
.ivy-sub{font-size:12px;color:var(--iv-mute);margin:4px 0 8px}
.ivy-two{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:400px){.ivy-two{grid-template-columns:1fr 1fr;gap:10px}}
.ivy-ref{font-weight:800;background:var(--iv-ivory)!important;letter-spacing:.06em}
.ivy-alt{margin-top:16px;padding-top:14px;border-top:1px solid var(--iv-line);text-align:center;font-size:12px;color:var(--iv-mute)}
.ivy-alt .btn{width:100%;margin-top:8px}
.ivy-foot{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--iv-mute)}

/* home */
.ivy-home{padding:8px 14px 14px;display:flex;flex-direction:column;gap:14px}
.ivy-home h1{margin:2px 0;font-size:20px;font-weight:800;color:var(--iv-deep);line-height:1.3;overflow-wrap:anywhere}
.ivy-home p{margin:0;font-size:12px;color:var(--iv-mute)}
.ivy-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--iv-gold);text-transform:uppercase}
.ivy-hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ivy-level-chip{background:var(--iv-deep);color:var(--iv-gold2);font-weight:800;font-size:12px;border-radius:999px;padding:6px 13px;white-space:nowrap}
.ivy-balance{background:linear-gradient(145deg,#0b1230,#2f5bff 65%,#5b7bff);color:#fff;border-radius:26px;padding:18px;position:relative;overflow:hidden;box-shadow:0 16px 34px rgba(11,18,48,.28)}
.ivy-balance::after{content:'';position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,192,255,.38),transparent 70%)}
.ivy-bal-top{display:flex;justify-content:space-between;font-size:12px;color:#c9d4ff;position:relative;z-index:1}
.ivy-bal-top i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.ivy-bal-amt{font-size:clamp(26px,9vw,36px);font-weight:800;margin:8px 0 14px;letter-spacing:-.02em;position:relative;z-index:1;overflow-wrap:anywhere}

/* ===== IVy loading screen (self-contained so it looks the same in any role) ===== */
.topbar:empty{display:none}
.ivy-load{min-height:72dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;text-align:center;background:radial-gradient(420px 300px at 50% 38%,rgba(91,123,255,.10),transparent),#f4f6fc;color:#0e1530;font-family:'Sora','Noto Sans Bengali',system-ui,sans-serif}
.ivy-load-ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;position:relative}
.ivy-load-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(139,123,255,0) 0 40%,#8b7bff 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:ivySpin 1.15s linear infinite}
.ivy-load-ring::after{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid #e3e7f4}
.ivy-load-mark{width:58px;height:58px;animation:ivyPulse 2.2s ease-in-out infinite}
.ivy-load-mark rect{fill:#2f5bff}.ivy-load-mark path:nth-of-type(1){fill:#c9c0ff}.ivy-load-mark path:nth-of-type(2){stroke:#2f5bff;stroke-width:2.4;stroke-linecap:round}

.ivy-load-txt{font-size:14px;font-weight:600;color:#6b7391}
.ivy-load-dots{display:flex;gap:7px}
.ivy-load-dots i{width:7px;height:7px;border-radius:50%;background:#2f5bff;opacity:.25;animation:ivyDot 1.2s ease-in-out infinite}
.ivy-load-dots i:nth-child(2){animation-delay:.2s}.ivy-load-dots i:nth-child(3){animation-delay:.4s}
@keyframes ivySpin{to{transform:rotate(360deg)}}
@keyframes ivyPulse{0%,100%{transform:scale(1)}50%{transform:scale(.93)}}
@keyframes ivyDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.ivy-load *,.ivy-load *::before{animation:none!important}.ivy-load-dots i{opacity:.7}}

.tb-st{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}
.tb-st.on{background:#dcfce7;color:#15803d}
.tb-st.off{background:#fee2e2;color:#b91c1c}
.tb-box{border:1.5px solid #fde68a}
.tb-chips{display:flex;flex-wrap:wrap;gap:6px}
.tb-chip{border:1.5px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:800;letter-spacing:1px;cursor:pointer;font-family:inherit;color:#0b1f3a}
.tb-chip.on{background:#fffbeb;border-color:#f59e0b;color:#b45309}
.tb-chip.new{letter-spacing:0;color:#2563eb;border-style:dashed}
/* member side */
.tb-homecard,.tb-lucky{display:flex;align-items:center;gap:10px;border:1.5px solid #fde68a;background:linear-gradient(135deg,#fffbeb,#fff)}
.tb-hc-ic{font-size:28px;line-height:1}
.tb-hc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-hc-t b{font-size:13px;font-weight:900;color:#0b1f3a}
.tb-hc-t span{font-size:11px;color:#64748b}
.tb-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:15px;letter-spacing:2px;color:#0b1f3a;background:#fffbeb;border:1.5px dashed #f59e0b;border-radius:10px;padding:7px 11px;cursor:pointer}
.tb-code-s{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:13px;letter-spacing:1.5px;color:#64748b}
.tb-copy{border:none;background:#0b1f3a;color:#fff;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.tb-copy.use{background:#059669;margin-left:6px}
.tb-copy[hidden]{display:none}
.tb-crow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed #e2e8f0}
.tb-crow:last-child{border-bottom:none}
.tb-crow.used{opacity:.75}
.tb-crow-b{display:flex;align-items:center;flex-shrink:0}
.tb-pop{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(92vw,400px);z-index:9000;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 12px;border-radius:20px;background:linear-gradient(135deg,#0b1f3a,#1e3a8a);color:#fff;box-shadow:0 14px 40px rgba(2,8,23,.5);animation:tbUp .55s cubic-bezier(.16,1,.3,1)}
.tb-pop-x{position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,.7);font-size:15px;cursor:pointer;padding:2px 6px}
.tb-pop-ic{font-size:30px;line-height:1;animation:tbBob 1.6s ease-in-out infinite}
.tb-pop-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tb-pop-b b{font-size:13px;font-weight:900;padding-right:14px}
.tb-pop-b small{font-size:10.5px;opacity:.8}
.tb-pop-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb-pop .tb-code{background:rgba(255,255,255,.12);color:#fde68a;border-color:#fbbf24;font-size:14px;padding:6px 10px}
.tb-pop .tb-copy{background:#f59e0b;color:#0b1f3a}
.tb-pop-go{width:auto;flex-shrink:0}
.tb-big{text-align:center;padding:6px 0 2px}
.tb-big-t{font-size:14px;font-weight:800;color:#475569}
.tb-big-a{font-size:46px;font-weight:900;color:#059669;line-height:1.15;margin:6px 0;animation:tbPop .6s cubic-bezier(.16,1,.3,1)}
.tb-big-s{font-size:12px;color:#64748b;font-weight:700}
.tb-wl{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;text-align:center;font-weight:900;font-size:14px;line-height:18px;color:#fff;pointer-events:none}
.tb-wl:nth-child(even){color:#0b1f3a}
@keyframes tbUp{from{opacity:0;transform:translate(-50%,70px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tbPop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes tbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== jamanot upgrade: method buttons + breakdown ===== */
.jx-opts{display:flex;flex-direction:column;gap:10px}
.jx-opt{display:block;width:100%;text-align:start;background:#fff;border:1.5px solid #cbd5e1;border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;color:#0e1530;transition:border-color .15s,box-shadow .15s}
.jx-opt:hover:not([disabled]){border-color:#2f5bff;box-shadow:0 6px 18px rgba(47,91,255,.15)}
.jx-opt>b{display:block;font-size:14px;font-weight:800;color:#0b1230;margin-bottom:4px}
.jx-opt em{display:block;font-size:12px;font-style:normal;color:#b45309;font-weight:700}
.jx-opt[disabled]{opacity:.55;cursor:not-allowed;background:#f8fafc}
.jx-prev{margin:10px 0;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:4px 12px}
.jx-bad{margin:4px 0 6px;font-size:12px;font-weight:700;color:#dc2626}
.jx-route{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
.jx-route>div{flex:1;min-width:0}
.jx-route>div:first-child{flex:.7}.jx-route>div:last-child{flex:1.5}
.jx-route small{display:block;font-size:11px;color:#64748b}
.jx-route b{display:block;font-size:20px;font-weight:900;color:#0b1230;line-height:1.2}
.jx-route em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#475569}
.jx-route i{font-style:normal;font-size:18px;color:#94a3b8;padding-bottom:6px}
.jx-route select{width:100%;margin-top:3px;font-size:13px;padding-left:10px;padding-right:26px;text-overflow:clip}
.jx-route.mini{justify-content:flex-start;align-items:center}.jx-route.mini>b,.jx-route.mini i{display:inline-block;flex:none;padding:0}.jx-route.mini b{font-size:18px}
.jx-balrow{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:7px 12px;margin-bottom:10px;font-size:12px;color:#64748b}
.jx-balrow b{font-size:14px;font-weight:900;color:#0e1530}
.jx-eq{display:block;padding:6px 0;border-bottom:1px dashed #e2e8f0}
.jx-eq:last-child{border-bottom:0}
.jx-eq small{display:block;font-size:11.5px;color:#64748b;margin-bottom:1px}
.jx-ex{display:block;font-size:15px;font-weight:700;color:#0e1530;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[dir=rtl] .jx-ex{text-align:right}
.jx-ex b{font-weight:900}
.jx-eq.main .jx-ex{font-size:17px}.jx-eq.main .jx-ex b{color:#1d4ed8}
.jx-eq.ref .jx-ex b{color:#059669}
.jx-eq.low .jx-ex b{color:#dc2626}
.jx-sum{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#fffbeb;border:1px dashed #f59e0b;font-size:11.5px;line-height:1.6;color:#92400e}
</style>

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');

function timeStr(ts){
  if(!ts) return '';
  try{ return new Date(ts).toLocaleString('en-GB',{timeZone:'Asia/Dhaka',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

function dhakaKey(ts){
  const d = new Date((ts||Date.now()) + DHAKA_OFFSET);
  return d.toISOString().slice(0,10);
}
function msToNextDhakaMidnight(){
  const now = Date.now() + DHAKA_OFFSET;
  const next = (Math.floor(now/86400000)+1)*86400000;
  return next - now;
}
function fmtCountdown(ms){
  if(ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return h+':'+m+':'+ss;
}
function genId(p){ return p+'-'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100).toString(36).toUpperCase(); }

}

function simpleHash(str){
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 = ((h1 ^ c) * 16777619) | 0;
    h2 = ((h2 + c*31) * 33) | 0;
  }
  return 'fnv'+h1.toString(16)+h2.toString(16);
}
async function hashPass(plain){
  const salted = 'jgm::v5::'+String(plain);
  try{
    if(window.crypto && window.crypto.subtle && window.TextEncoder){
      const buf = new TextEncoder().encode(salted);
      const dig = await crypto.subtle.digest('SHA-256', buf);
      return [...new Uint8Array(dig)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return simpleHash(salted);
}

/* ---------- generic path helpers ---------- */
function pathParts(p){ return String(p||'').split('/').filter(Boolean); }
function deepGet(o,parts){
  let c = o;
  for(const k of parts){ if(c==null) return null; c = c[k]; }
  return c===undefined ? null : c;
}
function deepSet(o,parts,v){
  let c = o;
  for(let i=0;i<parts.length-1;i++){
    if(typeof c[parts[i]] !== 'object' || c[parts[i]]===null) c[parts[i]] = {};
    c = c[parts[i]];
  }
  if(parts.length) c[parts[parts.length-1]] = v;
}

/* ---------- LOCAL realtime store (cross-tab via storage event) ---------- */
function makeLocalStore(){
  let db = {};
  try{ db = JSON.parse(localStorage.getItem(LS.local)||'{}') || {}; }catch(e){ db = {}; }
  const listeners = new Set();
  function persist(){ try{ localStorage.setItem(LS.local, JSON.stringify(db)); }catch(e){} }
  function notify(){
    listeners.forEach(l=>{
      try{ l.cb(deepGet(db, l.parts)); }catch(e){}
    });
  }
  window.addEventListener('storage', ev=>{
    if(ev.key !== LS.local) return;
    try{ db = JSON.parse(ev.newValue||'{}') || {}; }catch(e){ db = {}; }
    notify();
  });
  return {
    type:'local',
    isCloud:false,
    onValue(p, cb){
      const l = { parts:pathParts(p), cb };
      listeners.add(l);
      setTimeout(()=>{ try{ cb(deepGet(db, l.parts)); }catch(e){} }, 0);
      return ()=>listeners.delete(l);
    },
    async set(p,v){ deepSet(db, pathParts(p), v); persist(); notify(); },
    async update(p,o){
      const cur = deepGet(db, pathParts(p)) || {};
      deepSet(db, pathParts(p), Object.assign({}, cur, o));
      persist(); notify();
    },
    async remove(p){ deepSet(db, pathParts(p), null); persist(); notify(); },
    async transaction(p, updater){
      const parts = pathParts(p), cur = deepGet(db, parts);
      const next = updater(cur == null ? null : JSON.parse(JSON.stringify(cur)));
      if(next === undefined) return { committed:false, value:cur };
      deepSet(db, parts, next); persist(); notify();
      return { committed:true, value:next };
    },
    pushKey(p){ return genId('PUSH'); },
    watchConnection(cb){ setTimeout(()=>cb(true), 200); return ()=>{}; }
  };
}

/* ---------- FIREBASE realtime store (on('value') listeners only) ---------- */
function makeFirebaseStore(cfg){
  if(!window.firebase) throw new Error('Firebase SDK লোড হয়নি');
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const db = firebase.database();
  return {
    type:'firebase',
    isCloud:true,
    onValue(p, cb){
      const ref = db.ref(p);
      const h = ref.on('value', snap=>cb(snap.val()), err=>{ console.warn('[fb]',p,err&&err.message); if(window.__fbDenied) window.__fbDenied(p,err); });
      return ()=>ref.off('value', h);
    },
    async once(p){
      const snap = await db.ref(p).once('value');
      return snap.val();
    },
    async set(p,v){ await db.ref(p).set(v); },
    async update(p,o){ await db.ref(p).update(o); },
    async remove(p){ await db.ref(p).remove(); },
    async transaction(p, updater){
      return await new Promise((resolve,reject)=>{
        db.ref(p).transaction(cur=>updater(cur), (err, committed, snap)=>{
          if(err) return reject(err);
          resolve({committed:!!committed, value:snap ? snap.val() : null});
        }, false);
      });
    },
    pushKey(p){ return db.ref(p||'').push().key; },
    watchConnection(cb){
      const ref = db.ref('.info/connected');
      const h = ref.on('value', s=>cb(!!s.val()));
      return ()=>ref.off('value', h);
    }

function readConfig(){

  try{

    if(raw){
      const c = JSON.parse(raw);
      if(c && c.databaseURL) return c;
    }
  }catch(e){}
  return FIREBASE_CONFIG;
}

/*
 * Cross-device Firebase bootstrap:
 * The old build kept the active Firebase config only in localStorage, which
 * another phone cannot inherit. Referral links now carry a compact, encoded
 * copy of the web-app Firebase config. This does NOT contain database data.
 */
function readBootstrapConfigFromUrl(){
  try{
    const raw = new URLSearchParams(location.search).get('fb');
    if(!raw) return null;
    const json = decodeURIComponent(escape(atob(raw)));
    const c = JSON.parse(json);
    if(!configLooksReal(c)) return null;
    try{ localStorage.setItem(LS.cfg, JSON.stringify(c)); }catch(e){}
    return c;
  }catch(e){ return null; }
}

function currentFirebaseConfig(){
  if(configLooksReal(FIREBASE_CONFIG)) return FIREBASE_CONFIG;
  return readBootstrapConfigFromUrl() || readConfig();
}
function configLooksReal(c){
  return !!(c && typeof c.databaseURL === 'string' &&
    c.databaseURL.indexOf('https://') === 0 &&
    c.databaseURL.indexOf('YOUR_PROJECT_ID') === -1);
}

window.__fbDenied = function(p,err){
  if(window.__fbDeniedShown) return; window.__fbDeniedShown = true;
  try{ toast('Firebase Rules অনুমতি দিচ্ছে না ('+p+') — Console → Realtime Database → Rules চেক করুন','err'); }catch(e){}
};

let STORE_INIT_ERROR = '';
(function initStore(){

    Store = makeFirebaseStore(cfg);
  }catch(e){
    STORE_INIT_ERROR = e && e.message ? e.message : 'Firebase initialization failed';
    Store = null;
  }
})();

/* ---------- toast / modal ---------- */
function toast(msg,type){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(()=>el.remove(), 260);
  }, 2800);
}

/* ===== IVy i18n engine: bn / en / ar — centralized dictionary IVY_I18N, runtime DOM translation, RTL ===== */
const IVY_LANGS=['bn','en','ar'], IVY_LANG_KEY='ivy_lang_v1';
try{ const __sl=localStorage.getItem(IVY_LANG_KEY); if(IVY_LANGS.indexOf(__sl)>-1) STATE.lang=__sl; }catch(e){}
const IVY_BN_RE=/[\u0980-\u09F2\u09F4-\u09FF]/;
const IVY_TR_CACHE={};
function ivyTrTable(lang){
  if(IVY_TR_CACHE[lang]) return IVY_TR_CACHE[lang];
  const idx=lang==='ar'?2:1, m=new Map();
  IVY_I18N.forEach(r=>{ if(r[0] && r[idx]!=null) m.set(r[0],r[idx]); });
  if(lang==='en'){ Object.keys(EN).forEach(k=>{ if(!m.has(k)) m.set(k,EN[k]); }); }
  const keys=Array.from(m.keys()).sort((a,b)=>b.length-a.length);
  const re=new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).join('|'),'g');
  return IVY_TR_CACHE[lang]={m:m,re:re};
}
const IVY_BN_CH=/[\u0980-\u09FF]/;
function ivyTr(s,lang){
  lang=lang||STATE.lang; s=String(s==null?'':s);
  if(lang==='bn' || !IVY_BN_RE.test(s)) return s;
  const T=ivyTrTable(lang);
  return s.replace(T.re,(mt,off,str)=>{
    if(mt.length<=6){ /* short fragments must not sit inside a longer Bengali word */
      const p=str.charAt(off-1), n=str.charAt(off+mt.length);
      if((p && IVY_BN_CH.test(p) && IVY_BN_CH.test(mt.charAt(0))) || (n && IVY_BN_CH.test(n) && IVY_BN_CH.test(mt.charAt(mt.length-1)))) return mt;
    }
    return T.m.has(mt)?T.m.get(mt):mt;
  });
}
function t(s){ return ivyTr(s); }              /* translation function for dynamic strings */

}

function ivySetDir(){
  const c=STATE.lang, rtl=c==='ar';
  try{ const h=document.documentElement; h.lang=c; h.dir=rtl?'rtl':'ltr'; document.body.dir=rtl?'rtl':'ltr'; document.body.classList.toggle('ivy-rtl',rtl);
    document.title = c==='bn' ? 'IVy — আপনার স্মার্ট ডিজিটাল ওয়ালেট' : ivyTr('IVy — আপনার স্মার্ট ডিজিটাল ওয়ালেট',c); }catch(e){}
}
const IVY_ORIG=new WeakMap(); let ivyApplying=false, ivyObs=null, ivyRaf=0;
function ivyApply(root){
  root=root||document.body; if(!root) return; const lang=STATE.lang; ivyApplying=true;
  try{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){ const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT; const g=p.nodeName; if(g==='SCRIPT'||g==='STYLE'||g==='TEXTAREA'||g==='NOSCRIPT') return NodeFilter.FILTER_REJECT; if(p.closest && p.closest('[data-no-tr]')) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; }});
    const nodes=[]; let n; while((n=w.nextNode())) nodes.push(n);
    nodes.forEach(n=>{
      let rec=IVY_ORIG.get(n); if(rec && n.nodeValue!==rec.tr) rec=null;   /* app rewrote the node → new source text */
      const src=rec?rec.src:n.nodeValue, out=ivyTr(src,lang);
      IVY_ORIG.set(n,{src:src,tr:out}); if(out!==n.nodeValue) n.nodeValue=out;
    });
    if(root.querySelectorAll) root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
      if(el.closest('[data-no-tr]')) return;
      ['placeholder','title','aria-label'].forEach(a=>{
        if(!el.hasAttribute(a)) return; const ks='data-bn-'+a, kt='data-tr-'+a, cur=el.getAttribute(a);
        const src=(el.hasAttribute(ks) && el.getAttribute(kt)===cur) ? el.getAttribute(ks) : cur, out=ivyTr(src,lang);
        el.setAttribute(ks,src); el.setAttribute(kt,out); if(cur!==out) el.setAttribute(a,out);
      });
    });
  }catch(e){ console.warn('[i18n]',e); }
  finally{ if(ivyObs) try{ ivyObs.takeRecords(); }catch(_){} ivyApplying=false; }
}
function applyLang(){
  ivySetDir(); ivyApply(document.body);
  if(!ivyObs && window.MutationObserver && document.body){
    ivyObs=new MutationObserver(()=>{ if(ivyApplying) return; cancelAnimationFrame(ivyRaf); ivyRaf=requestAnimationFrame(()=>ivyApply(document.body)); });
    ivyObs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
}
function setLang(c){
  if(IVY_LANGS.indexOf(c)<0) return; STATE.lang=c; STATE.langMenu=false;
  try{ localStorage.setItem(IVY_LANG_KEY,c); }catch(e){}
  render();
}

/* ===================================================================================
   TREASURY BOX + COUPONS + LUCKY SPIN v2  (admin-controlled, deterministic)
   RULES (strict):
   - Nothing is paid unless the exact amount was set by the admin (rules / coupon / wheel slot / bonus box).
   - A personal coupon is usable ONLY by the account it was issued to.
   - The only coupon usable by everyone is an admin-created public coupon (time-limited, once per member).
   - Spins: only granted spins (admin rule / admin profile) or an admin campaign window; never more.
   - Every credit is ONE atomic transaction on users/<id> that also writes its own "once" guard.
   Data:  treasury/rules/{coupon|spin}/<kind>/<level>      kind = newSelf|newRef|upSelf|upRef
          treasury/lucky/{slots:{s1..s8}, levelSlots:{<level>:[1..8, …]}}      (old single-number levelSlot:{<level>:n} is still honoured)
          treasury/campaign/{id,on,count,startAt,endAt,slots:[1..8, …],activeOnly}   (old single `slot` is still honoured)
          users/<uid>/spinBag/<ctx>/{sig,left,last}   ctx = L_<level> | C_<campaignId>  — which numbers are still unused in the current round
          couponsByUser/<uid>/<CODE>   couponsGlobal/<CODE>   indexes/couponCode/<CODE> = uid | 'GLOBAL'
          couponIssued/<opId>_<kind>   (idempotent issuing guard)
          users/<uid>/{couponCredits, bonusLog, spinGranted, spinUsed, spinGrantLog, spinCampUsed, spinBag}
   =================================================================================== */
const TB_KEYS = ['newSelf','newRef','upSelf','upRef'];
const TB_KIND_LABEL = {newSelf:'নতুন সদস্য', newRef:'নতুন সদস্যের রেফারার', upSelf:'আপগ্রেডকারী সদস্য', upRef:'আপগ্রেডকারীর রেফারার', admin:'এডমিন'};
const TB_REASON = {
  newSelf:'নতুন সদস্য হিসেবে যুক্ত হওয়ার বোনাস',
  newRef:'আপনার রেফার করা সদস্য যুক্ত হওয়ার বোনাস',
  upSelf:'অবস্থান আপগ্রেড বোনাস',
  upRef:'আপনার রেফার করা সদস্যের আপগ্রেড বোনাস'
};
const TB_LABEL = {coupon:'ট্রেজারি কুপন বোনাস', spin:'লাকি স্পিন বোনাস', bonus:'এডমিন বোনাস'};
const TB_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TB_SLOTS = 8;
STATE.tb = {cfg:{}, my:{}, byUser:{}, globals:{}, homeSeen:false, busy:false, fails:0, lockUntil:0, code:'', sugg:[],
            draft:null, f:{}, unsubs:[], key:'', reveal:{}, spinBusy:false, cfgReady:false, abusy:false, err:''};

/* ---------- helpers ---------- */
function tbRound(n){ return Math.round((Number(n)||0)*100)/100; }
function tbNorm(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function tbGenCode(){
  const v = new Uint32Array(8); crypto.getRandomValues(v);
  return 'TB' + Array.from(v, x=>TB_ALPHA[x % TB_ALPHA.length]).join('');
}
function tbMask(code){ code = String(code||''); return code.length<=4 ? code : code.slice(0,2) + '••••••' + code.slice(-2); }
function tbAmt(n){ n = tbRound(n); return Number.isInteger(n) ? money0(n) : money(n); }
function tbRules(){ return (STATE.tb.cfg && STATE.tb.cfg.rules) || {}; }
function tbRuleAmt(rules, sec, kind, lvl){
  const v = Number((((rules||{})[sec]||{})[kind]||{})[lvl]);
  if(!(v>0) || !isFinite(v)) return 0;
  return sec==='spin' ? Math.floor(v) : tbRound(v);
}
function tbDurMs(n, unit){ n = Number(n)||0; return n * (unit==='d' ? 86400000 : unit==='h' ? 3600000 : 60000); }
function tbF(k, d){ const v = STATE.tb.f[k]; return (v===undefined||v===null) ? (d===undefined?'':d) : v; }
function tbClearF(prefix){ Object.keys(STATE.tb.f).forEach(k=>{ if(!prefix || k.indexOf(prefix)===0) delete STATE.tb.f[k]; }); }

/* Atomic transaction on users/<uid>. fn(cur) returns the NEW user object, or a STRING (failure reason => nothing is written). */
async function tbUserTx(uid, fn){
  let fail = '';
  const r = await Store.transaction('users/'+uid, cur=>{
    fail = '';
    if(cur===null || cur===undefined) return cur;
    const o = fn(cur);
    if(typeof o === 'string'){ fail = o; return; }
    return o;
  });
  if(r.committed && r.value && !fail) return {ok:true, user:r.value};
  return {ok:false, fail: fail || (r.value ? 'abort' : 'missing')};
}

/* ---------- coupon codes (global uniqueness through indexes/couponCode) ---------- */
async function tbReserveCode(owner, wanted){
  const tries = wanted ? 1 : 6;
  for(let i=0;i<tries;i++){
    const code = wanted || tbGenCode();
    const r = await Store.transaction('indexes/couponCode/'+code, cur=>cur?undefined:owner);
    if(r.committed && r.value===owner) return code;
  }
  return '';
}
/* Idempotent personal-coupon issuing: the guard couponIssued/<gkey> is written first and carries the code,
   so a retry can only finish the SAME coupon — it can never create a second one. */
async function tbIssueCoupon(gkey, uid, kind, amount, reason, by, wanted){
  amount = tbRound(amount);
  if(!uid || !(amount>0)) return {ok:false, msg:'সঠিক পরিমাণ দিন'};
  const gp = 'couponIssued/'+gkey;
  let g = await Store.once(gp);
  if(!g){
    const code = await tbReserveCode(uid, wanted||'');
    if(!code) return {ok:false, msg: wanted ? 'এই কুপন নম্বরটি আগেই ব্যবহার হয়েছে — অন্য নম্বর দিন' : 'কোড তৈরি হয়নি — আবার চেষ্টা করুন'};
    const rec = {code:code, uid:uid, kind:kind, amount:amount, reason:String(reason||'').slice(0,120), by:by||'system', ts:wthNowMs(), done:false};
    const c = await Store.transaction(gp, cur=>cur?undefined:rec);
    if(c.committed) g = rec;
    else{
      try{ await Store.transaction('indexes/couponCode/'+code, cur=>cur===uid?null:undefined); }catch(_e){}
      g = await Store.once(gp);
    }
  }
  if(!g || !g.code) return {ok:false, msg:'কুপন তৈরি হয়নি'};
  if(!g.done){
    await Store.set('couponsByUser/'+g.uid+'/'+g.code, {code:g.code, scope:'personal', owner:g.uid, amount:g.amount, kind:g.kind, reason:g.reason||'', by:g.by||'system', createdAt:g.ts, gkey:gkey});
    await Store.update(gp, {done:true});
  }
  return {ok:true, code:g.code, amount:g.amount};
}

/* ---------- spins granted (idempotent by key) ---------- */
async function tbGrantSpins(uid, n, reason, key){
  n = Math.floor(Number(n)||0);
  if(!uid || n<1) return {ok:false, msg:'সঠিক সংখ্যা দিন'};
  const r = await tbUserTx(uid, cur=>{
    if(cur.spinGrantLog && cur.spinGrantLog[key]) return 'dup';
    return Object.assign({}, cur, {
      spinGranted: (Math.floor(Number(cur.spinGranted)||0)) + n,
      spinGrantLog: Object.assign({}, cur.spinGrantLog||{}, {[key]:{n:n, reason:String(reason||'').slice(0,120), ts:wthNowMs()}})
    });
  });
  if(r.ok) return {ok:true};
  if(r.fail==='dup') return {ok:true, dup:true};
  return {ok:false, msg:'স্পিন যোগ হয়নি'};
}

/* ---------- admin direct bonus (amount + reason) ---------- */
async function tbAdminBonus(uid, amount, reason, bkey){
  amount = tbRound(amount);
  if(!(amount>0)) return {ok:false, msg:'সঠিক পরিমাণ দিন'};
  reason = String(reason||'').trim().slice(0,120);
  if(reason.length<2) return {ok:false, msg:'কারণ লিখুন'};
  const key = 'B_'+bkey, now = wthNowMs();
  const r = await tbUserTx(uid, cur=>{
    if(cur.bonusLog && cur.bonusLog[key]) return 'dup';
    return Object.assign({}, cur, {
      balance: (Number(cur.balance)||0) + amount,
      bonusLog: Object.assign({}, cur.bonusLog||{}, {[key]:{type:'bonus', amount:amount, reason:reason, ts:now, by:'admin'}})
    });
  });
  if(!r.ok) return {ok:false, msg: r.fail==='dup' ? 'এই বোনাস আগেই দেওয়া হয়েছে' : 'বোনাস দেওয়া হয়নি'};
  await addLog('TB_BONUS', uid+' +'+money0(amount)+' '+reason, true);
  return {ok:true};
}

/* ---------- events: first activation (M0 -> active) and later upgrades ---------- */
async function tbOnUpgrade(uid, rec, op){
  if(!uid || !rec || !rec.toLevel || !op) return;
  const rules = (await Store.once('treasury/rules')) || {};
  const first = rec.fromLevel === 'M0', lvl = rec.toLevel;
  const kSelf = first ? 'newSelf' : 'upSelf', kRef = first ? 'newRef' : 'upRef';
  const me = await Store.once('users/'+uid);
  if(!me) return;
  let refId = null;
  if(me.referredBy){
    const r = await Store.once('indexes/referrals/'+String(me.referredBy));
    if(r && r!==uid){ const ru = await Store.once('users/'+r); if(ru) refId = r; }
  }
  const jobs = [[kSelf, uid], [kRef, refId]];
  for(const j of jobs){
    const kind = j[0], owner = j[1];
    if(!owner) continue;
    const amt = tbRuleAmt(rules, 'coupon', kind, lvl);
    if(amt>0){
      try{ const r = await tbIssueCoupon(op+'_'+kind, owner, kind, amt, TB_REASON[kind], 'system'); if(r.ok) await addLog('TB_COUPON_ISSUE', owner+' '+kind+' ('+op+')', true); }
      catch(e){ console.warn('[tb] coupon', e); }
    }
    const n = tbRuleAmt(rules, 'spin', kind, lvl);
    if(n>0){
      try{ await tbGrantSpins(owner, n, TB_REASON[kind], 'EV_'+op+'_'+kind); }
      catch(e){ console.warn('[tb] spin', e); }
    }
  }
}

/* ---------- claim a coupon code (member) ---------- */
async function tbClaimCore(uid, raw){
  const code = tbNorm(raw);
  if(code.length<4 || code.length>24) return {ok:false, bad:true, msg:'সঠিক কুপন কোড দিন'};
  const u = STATE.users[uid]; if(!u) return {ok:false, msg:'অ্যাকাউন্ট পাওয়া যায়নি'};
  const st = accountStatus(u); if(st) return {ok:false, msg:st.msg};
  try{ await wthSyncServerTime(); }catch(_e){}
  const owner = await Store.once('indexes/couponCode/'+code);
  let rec = null, scope = '';
  if(owner === 'GLOBAL'){ rec = await Store.once('couponsGlobal/'+code); scope = 'global'; }
  else if(owner === uid){ rec = await Store.once('couponsByUser/'+uid+'/'+code); scope = 'personal'; }
  /* someone else's personal code looks exactly like a wrong code — nothing is revealed and nothing is paid */
  if(!rec || rec.code!==code) return {ok:false, bad:true, msg:'কুপন কোডটি সঠিক নয়'};
  const amt = tbRound(rec.amount);
  if(!(amt>0)) return {ok:false, bad:true, msg:'কুপন কোডটি সঠিক নয়'};
  if(scope==='global'){
    const now = wthNowMs();
    if(rec.closed) return {ok:false, msg:'এই কুপনটি বন্ধ করা হয়েছে'};
    if(now < Number(rec.startAt)) return {ok:false, msg:'এই কুপন এখনো শুরু হয়নি'};
    if(now > Number(rec.endAt)) return {ok:false, msg:'এই কুপনের সময় শেষ হয়ে গেছে'};
    if(rec.activeOnly && !isActiveMember(u)) return {ok:false, msg:'এই কুপন শুধু সক্রিয় সদস্যদের জন্য'};
  }else{
    if(rec.owner !== uid) return {ok:false, bad:true, msg:'কুপন কোডটি সঠিক নয়'};
    if(rec.usedAt) return {ok:false, msg:'এই কুপনটি আগেই ব্যবহার করা হয়েছে'};
  }
  const now2 = wthNowMs(), key = 'C_'+code;
  const r = await tbUserTx(uid, cur=>{
    if(cur.couponCredits && cur.couponCredits[code]) return 'used';
    if(accountStatus(cur)) return 'blocked';
    if(scope==='global' && wthNowMs() > Number(rec.endAt)) return 'expired';
    return Object.assign({}, cur, {
      balance: (Number(cur.balance)||0) + amt,
      couponCredits: Object.assign({}, cur.couponCredits||{}, {[code]:{amount:amt, ts:now2, scope:scope}}),
      bonusLog: Object.assign({}, cur.bonusLog||{}, {[key]:{type:'coupon', amount:amt, reason:rec.reason||'', ref:code, ts:now2}})
    });
  });
  if(!r.ok){

    return {ok:false, msg:m[r.fail] || 'কুপন ব্যবহার করা যায়নি — আবার চেষ্টা করুন'};
  }
  try{
    if(scope==='personal') await Store.update('couponsByUser/'+uid+'/'+code, {usedAt:now2});
    else await Store.update('couponsGlobal/'+code+'/usedBy', {[uid]:now2});
  }catch(_e){}
  await addLog('TB_COUPON_CLAIM', uid+' '+code+' +'+money0(amt), true);
  return {ok:true, amount:amt, reason:rec.reason||'', scope:scope};

/* ---------- Lucky Spin: wheel config + atomic spin ---------- */
function tbSlots(cfg){
  const s = (cfg && cfg.lucky && cfg.lucky.slots) || {}, out = [];
  for(let i=1;i<=TB_SLOTS;i++){ const raw = s['s'+i]; const v = (raw===undefined||raw===null||raw==='') ? NaN : Number(raw); out.push(isFinite(v) && v>=0 ? tbRound(v) : null); }
  return out;
}
/* Which wheel numbers may come up for a level: the admin-ticked numbers of that level (treasury/lucky/levelSlots/<level>),
   or — for data saved before multi-select existed — the single old levelSlot/<level>. Only numbers that have an admin-set amount count. */
function tbCleanSlotList(raw, slots){
  let arr = Array.isArray(raw) ? raw : (raw && typeof raw==='object') ? Object.keys(raw).map(k=>raw[k]) : (raw===undefined||raw===null||raw==='') ? [] : [raw];
  const out = [];
  arr.forEach(x=>{ const k = Number(x); if(k>=1 && k<=TB_SLOTS && k===Math.floor(k) && slots[k-1]!==null && slots[k-1]!==undefined && out.indexOf(k)<0) out.push(k); });
  return out.sort((a,b)=>a-b);
}
function tbLevelSlots(cfg, lv, slots){
  slots = slots || tbSlots(cfg);
  const L = (cfg && cfg.lucky) || {};
  if(L.levelSlots && L.levelSlots[lv]!==undefined && L.levelSlots[lv]!==null) return tbCleanSlotList(L.levelSlots[lv], slots);
  return tbCleanSlotList(L.levelSlot ? L.levelSlot[lv] : undefined, slots);
}
function tbCampSlots(camp, slots){
  if(!camp) return [];
  const has = camp.slots!==undefined && camp.slots!==null;
  return tbCleanSlotList(has ? camp.slots : camp.slot, slots);
}
function tbRandInt(n){ const v = new Uint32Array(1); crypto.getRandomValues(v); return v[0] % n; }
function tbBagKey(prefix, id){ return prefix + '_' + String(id==null?'':id).replace(/[.#$\[\]\/\s]/g,'_'); }
/* One draw from `pool` (the numbers the admin allowed).  A number is never shown twice until EVERY number of the pool has been shown once
   (a "round"); the first number of a new round is never the one that closed the previous round. Only numbers inside `pool` can ever be returned. */
function tbPickSlot(pool, bag){
  const sig = pool.join(',');
  const raw = bag && bag.left;
  let left = (Array.isArray(raw) ? raw : (raw && typeof raw==='object') ? Object.keys(raw).map(k=>raw[k]) : []).map(Number).filter(k=>pool.indexOf(k)>=0);
  const last = bag ? Number(bag.last)||0 : 0;
  const fresh = !(bag && bag.sig===sig && left.length);
  if(fresh) left = pool.slice();
  let cand = left;
  if(fresh && pool.length>1 && last){ const c2 = left.filter(k=>k!==last); if(c2.length) cand = c2; }
  const pick = cand[tbRandInt(cand.length)];
  return {slot:pick, bag:{sig:sig, left:left.filter(k=>k!==pick), last:pick}};
}
function tbSlotListTxt(list, slots){ return list.map(k=>'#'+k+' ('+(slots[k-1]===null||slots[k-1]===undefined?'—':tbAmt(slots[k-1]))+')').join(' • '); }
function tbCampActive(camp, u, now){
  return !!(camp && camp.on && camp.id && now>=Number(camp.startAt) && now<=Number(camp.endAt) && !(camp.activeOnly && !isActiveMember(u)));
}
function tbSpinInfo(u){
  const cfg = STATE.tb.cfg || {}, camp = cfg.campaign || null, now = wthNowMs();
  const granted = Math.max(0, Math.floor(Number(u.spinGranted)||0)), used = Math.max(0, Math.floor(Number(u.spinUsed)||0));
  const rem = Math.max(0, granted - used);
  let c = null;
  if(tbCampActive(camp, u, now)){
    const cu = Math.max(0, Math.floor(Number((u.spinCampUsed||{})[camp.id])||0));
    const left = Math.max(0, Math.floor(Number(camp.count)||0) - cu);
    if(left>0) c = {id:camp.id, left:left, endAt:Number(camp.endAt), slots:tbCampSlots(camp, tbSlots(cfg))};
  }
  return {granted:granted, used:used, rem:rem, camp:c, total: rem + (c ? c.left : 0)};
}
/* One spin = one transaction: spin count check + balance credit + history entry + "which numbers are used up" bookkeeping.
   The landing number comes ONLY from the numbers the admin ticked for the member's level (or the campaign); the amount ONLY from the admin's wheel amounts.
   Several numbers ticked → they come up in a random order, none twice until all have been shown once (see tbPickSlot). */
async function tbSpinCore(uid){
  try{ await wthSyncServerTime(); }catch(_e){}
  const cfg = (await Store.once('treasury')) || {};
  const slots = tbSlots(cfg), camp = cfg.campaign || null;
  const key = 'S_' + (Store.pushKey('users/'+uid+'/bonusLog') || genId('S'));
  let res = null;
  const r = await tbUserTx(uid, cur=>{
    res = null;
    if(accountStatus(cur)) return 'blocked';
    const now = wthNowMs();
    const granted = Math.max(0, Math.floor(Number(cur.spinGranted)||0)), used = Math.max(0, Math.floor(Number(cur.spinUsed)||0));
    let src = '', pool = [], ctx = '', cid = '', cu = 0;
    if(tbCampActive(camp, cur, now)){
      cu = Math.max(0, Math.floor(Number((cur.spinCampUsed||{})[camp.id])||0));
      if(Math.floor(Number(camp.count)||0) - cu > 0){ src = 'camp'; cid = camp.id; pool = tbCampSlots(camp, slots); ctx = tbBagKey('C', cid); }
    }
    if(!src && granted - used > 0){ src = 'grant'; pool = tbLevelSlots(cfg, cur.level, slots); ctx = tbBagKey('L', cur.level); }
    if(!src) return 'none';
    if(!pool.length) return 'cfg';
    const bags = (cur.spinBag && typeof cur.spinBag==='object') ? cur.spinBag : {};
    const pk = tbPickSlot(pool, bags[ctx]), slot = pk.slot, amt = slots[slot-1];
    if(amt===null || amt===undefined || !(amt>=0)) return 'cfg';
    res = {src:src, slot:slot, amount:amt, cid:cid};
    const curC = (camp && camp.id) ? tbBagKey('C', camp.id) : '', nb = {};          /* keep level bags + the live campaign's bag; drop old campaigns' */
    Object.keys(bags).forEach(k=>{ if(k.indexOf('C_')!==0 || k===curC) nb[k] = bags[k]; });
    nb[ctx] = pk.bag;
    const patch = {
      balance: (Number(cur.balance)||0) + amt,
      bonusLog: Object.assign({}, cur.bonusLog||{}, {[key]:{type:'spin', amount:amt, slot:slot, ts:now, ref:cid||'grant'}}),
      spinBag: nb
    };
    if(src==='camp') patch.spinCampUsed = Object.assign({}, cur.spinCampUsed||{}, {[cid]:cu+1});
    else patch.spinUsed = used + 1;
    return Object.assign({}, cur, patch);
  });
  if(!r.ok || !res){
    const m = {none:'আপনার কোনো স্পিন বাকি নেই', cfg:'লাকি স্পিন এখনো সেট করা হয়নি — এডমিনের সাথে যোগাযোগ করুন', blocked:'আপনার অ্যাকাউন্টে এখন স্পিন করা যাবে না', missing:'অ্যাকাউন্ট পাওয়া যায়নি'};
    return {ok:false, msg:m[r.fail] || 'স্পিন সম্পন্ন হয়নি — আবার চেষ্টা করুন'};
  }
  await addLog('TB_SPIN', uid+' slot '+res.slot+' +'+money0(res.amount), true);
  return {ok:true, slot:res.slot, amount:res.amount, user:r.user};
}

/* ===================== ADMIN: drafts (typed values survive live re-renders) ===================== */
function tbDraftInit(){
  if(STATE.tb.draft) return;
  const c = STATE.tb.cfg || {};
  STATE.tb.draft = JSON.parse(JSON.stringify({rules:c.rules||{}, lucky:c.lucky||{}}));
  const dl = STATE.tb.draft.lucky;                                   /* old single-number config → shown as a one-item list, saved in the new format */
  if(dl.levelSlot && typeof dl.levelSlot==='object'){
    dl.levelSlots = (dl.levelSlots && typeof dl.levelSlots==='object') ? dl.levelSlots : {};
    Object.keys(dl.levelSlot).forEach(lv=>{ if(dl.levelSlots[lv]===undefined){ const k = Number(dl.levelSlot[lv]); if(k>=1 && k<=TB_SLOTS && k===Math.floor(k)) dl.levelSlots[lv] = [k]; } });
    delete dl.levelSlot;
  }
}
function tbDGet(path, d){
  let o = STATE.tb.draft; if(!o) return d===undefined?'':d;
  const p = path.split('.');
  for(let i=0;i<p.length;i++){ if(o===null||o===undefined||typeof o!=='object') return d===undefined?'':d; o = o[p[i]]; }
  return (o===undefined||o===null) ? (d===undefined?'':d) : o;
}
function tbDSet(path, v){
  tbDraftInit();
  const p = path.split('.'); let o = STATE.tb.draft;
  for(let i=0;i<p.length-1;i++){ if(!o[p[i]] || typeof o[p[i]]!=='object') o[p[i]] = {}; o = o[p[i]]; }
  if(v==='' || v===null || v===undefined) delete o[p[p.length-1]]; else o[p[p.length-1]] = v;
}
/* draft: the numbers ticked for a level */
function tbDLs(lv){
  const d = (STATE.tb.draft && STATE.tb.draft.lucky) || {}, raw = d.levelSlots && d.levelSlots[lv];
  const arr = Array.isArray(raw) ? raw : (raw && typeof raw==='object') ? Object.keys(raw).map(k=>raw[k]) : [];
  return arr.map(Number).filter((k,i,a)=>k>=1 && k<=TB_SLOTS && k===Math.floor(k) && a.indexOf(k)===i).sort((x,y)=>x-y);
}
function tbLsSet(lv, k, on){
  tbDraftInit(); const cur = tbDLs(lv), i = cur.indexOf(k);
  if(on && i<0) cur.push(k); if(!on && i>=0) cur.splice(i,1);
  cur.sort((x,y)=>x-y);
  const L = (STATE.tb.draft.lucky = STATE.tb.draft.lucky || {}); L.levelSlots = L.levelSlots || {};
  if(cur.length) L.levelSlots[lv] = cur; else delete L.levelSlots[lv];
}
function tbLsAmtTxt(lv){
  const ks = tbDLs(lv); if(!ks.length) return '= —';
  return '= '+ks.map(k=>{ const raw = tbDGet('lucky.slots.s'+k,''); return raw==='' ? '—' : tbAmt(Number(raw)||0); }).join(' • ')+(ks.length===1 ? ' • ১টি মাত্র — প্রতিবার একই' : '');
}

}
function tbOnInput(e){
  const t = e.target; if(!t || !t.getAttribute) return;

    STATE.tb.f[f] = (t.type==='checkbox') ? !!t.checked : t.value;

async function tbSaveLucky(){
  const err = $('tbErrL'); if(err) err.textContent = '';
  const fail = m=>{ if(err) err.textContent = m; return false; };
  const d = STATE.tb.draft || {};
  const sp = tbRulesClean('spin'); if(sp.bad) return fail(sp.bad);
  const slots = {}, ls = {};
  const rawS = (d.lucky && d.lucky.slots) || {};
  for(let i=1;i<=TB_SLOTS;i++){
    const raw = rawS['s'+i]; if(raw===undefined || String(raw).trim()==='') continue;
    const n = Number(raw); if(!isFinite(n) || n<0) return fail('চাকার #'+i+' এর পরিমাণ সঠিক নয়');
    slots['s'+i] = tbRound(n);
  }
  for(const l of levels()){
    const ks = tbDLs(l.id); if(!ks.length) continue;
    for(const k of ks){ if(slots['s'+k]===undefined) return fail('অবস্থান '+l.id+': চাকার #'+k+' এর পরিমাণ আগে দিন'); }
    ls[l.id] = ks;
  }
  try{
    await Store.set('treasury/rules/spin', Object.keys(sp.out).length ? sp.out : null);
    await Store.set('treasury/lucky', (Object.keys(slots).length || Object.keys(ls).length) ? Object.assign({slots:slots}, Object.keys(ls).length ? {levelSlots:ls} : {}) : null);
    await addLog('TB_RULES', 'লাকি স্পিন সেটিং Live সেভ', true);
    toast('✓ লাকি স্পিন Live সেভ হয়েছে','ok'); return true;
  }catch(e){ return fail('সেভ হয়নি — আবার চেষ্টা করুন'); }
}
function tbCampStart(){
  const err = $('tbErrK'); if(err) err.textContent = '';
  const fail = m=>{ if(err) err.textContent = m; };
  const cfg = STATE.tb.cfg || {}, slots = tbSlots(cfg);
  const count = Math.floor(Number(tbF('k_count'))), dur = Number(tbF('k_dur')), unit = tbF('k_unit','h');
  const pick = []; for(let i=1;i<=TB_SLOTS;i++){ if(tbF('k_s'+i,false)) pick.push(i); }
  if(!(count>=1 && count<=100)) return fail('প্রতি সদস্যের স্পিন ১–১০০ হতে হবে');
  if(!pick.length) return fail('কোন কোন নম্বরে থামবে — অন্তত একটি বাছুন');
  if(pick.some(k=>slots[k-1]===null || slots[k-1]===undefined)) return fail('নির্বাচিত নম্বরের পরিমাণ আগে সেভ করুন');
  if(!(dur>0)) return fail('সময়কাল দিন');
  const ms = tbDurMs(dur, unit); if(ms > 90*86400000) return fail('সর্বোচ্চ ৯০ দিন');
  let startAt = wthNowMs();
  if(tbF('k_start')){ startAt = Date.parse(String(tbF('k_start'))+':00+06:00'); if(isNaN(startAt)) return fail('শুরুর সময় সঠিক নয়'); }
  const endAt = startAt + ms; if(endAt <= wthNowMs()) return fail('শেষের সময় অতীতে — সময় ঠিক করুন');
  const act = !!tbF('k_act', false);
  rxConfirm('ক্যাম্পেইন চালু করবেন?', 'প্রতি সদস্য '+count+' টি স্পিন • নম্বর '+tbSlotListTxt(pick, slots)+' • '+timeStr(startAt)+' থেকে '+timeStr(endAt)+'। আগের ক্যাম্পেইন (থাকলে) বদলে যাবে।', 'চালু করুন', async()=>{
    if(STATE.tb.abusy) return; STATE.tb.abusy = true;
    try{
      await Store.set('treasury/campaign', {id:'CMP'+Date.now().toString(36).toUpperCase(), on:true, count:count, slots:pick, slot:pick[0], startAt:startAt, endAt:endAt, activeOnly:act, createdAt:wthNowMs()});
      await addLog('TB_CAMPAIGN', count+' spin slots '+pick.join(','), true);
      tbClearF('k_'); toast('✓ ক্যাম্পেইন চালু হয়েছে','ok'); render();
    }catch(e){ fail('সংযোগ সমস্যা — আবার চেষ্টা করুন'); }
    finally{ STATE.tb.abusy = false; }
  });
}

/* ===================== live subscriptions (one set per login) ===================== */
function tbSync(){
  const T = STATE.tb;
  const key = (!Store || Store.type!=='firebase') ? '' : (STATE.role==='admin' ? 'A' : (STATE.role==='user' && STATE.userId ? 'U:'+STATE.userId : ''));
  if(key === T.key) return;
  T.unsubs.forEach(f=>{ try{ f(); }catch(_e){} });
  T.unsubs = []; T.key = key; T.my = {}; T.byUser = {}; T.globals = {}; T.homeSeen = false; T.cfgReady = false; T.draft = null;
  T.code = ''; T.err = ''; T.reveal = {}; T.fails = 0; T.lockUntil = 0; T.busy = false; T.f = {}; T.sugg = [];   /* nothing typed by the previous account may leak into the next one */
  if(!key) return;
  T.unsubs.push(Store.onValue('treasury', v=>{ T.cfg = v || {}; T.cfgReady = true; scheduleRender(); }));
  if(key==='A'){
    T.unsubs.push(Store.onValue('couponsByUser', v=>{ T.byUser = v || {}; scheduleRender(); }));
    T.unsubs.push(Store.onValue('couponsGlobal', v=>{ T.globals = v || {}; scheduleRender(); }));
  }else{
    const uid = STATE.userId;
    T.unsubs.push(Store.onValue('couponsByUser/'+uid, v=>{ T.my = v || {}; scheduleRender(); }));
  }
}

function levelBonusMap(){ const m=STATE.settings && STATE.settings.referralBonusByLevel; return (m && typeof m==='object') ? m : {}; }
function levelBonusFor(lvl){ const v=levelBonusMap()[lvl]; return (v===undefined||v===null||v==='') ? null : Number(v); }
/* ===== REFERRAL BONUS =====
   Paid ONLY for a first-time direct upgrade from M0 (IVy0) to an active level.
   The stored upgrade record (users/<id>/upgradeOps/<upgradeId>, written inside the same
   atomic transaction that deducted the deposit) is the single source of truth.
   Registration, deposit approval, login, refresh, listeners, tasks, team commission and
   upgrades from any non-M0 level can never reach this function with an eligible record. */
function refBonusActive(lvl){ const m=STATE.settings&&STATE.settings.referralBonusActive; return !(m&&typeof m==='object'&&m[lvl]===false); }
async function tryReferralBonus(uid, upgradeId){
  try{
    if(!uid || !upgradeId) return {paid:false,reason:'no-upgrade'};
    const tg = await Store.once('users/'+uid);
    if(!tg || !tg.id || !tg.referredBy || tg.bonusGiven) return {paid:false,reason:'no-referrer-or-already-given'};
    const up = tg.upgradeOps && tg.upgradeOps[upgradeId];
    if(!up || up.fromLevel!=='M0' || !up.toLevel || up.toLevel==='M0') return {paid:false,reason:'not-from-M0'};
    if(!refBonusActive(up.toLevel)) return {paid:false,reason:'level-bonus-inactive'};
    const inviterId = await Store.once('indexes/referrals/'+String(tg.referredBy));
    if(!inviterId || inviterId===tg.id) return {paid:false,reason:'no-valid-referrer'};
    const amt = levelBonusFor(up.toLevel) ?? settingNum('referralBonus',150);
    if(!(Number(amt)>0)) return {paid:false,reason:'zero-amount'};
    const claim = await Store.transaction('referralBonuses/'+tg.id, cur=>cur||{id:tg.id,upgradeId:upgradeId,referrerId:inviterId,referredId:tg.id,referredName:tg.name||'',fromLevel:up.fromLevel,toLevel:up.toLevel,referredLevel:up.toLevel,source:up.source||'user',amount:Number(amt),status:'pending',createdAt:Date.now()});
    const rec = (claim && claim.value) || {};
    if(rec.status==='paid' || rec.paidAt){ await Store.update('users/'+tg.id,{bonusGiven:true}); return {paid:false,reason:'already-paid'}; }
    if(!rec.referrerId) return {paid:false,reason:'no-claim'};
    await Store.transaction('users/'+rec.referrerId, cur=>{
      if(!cur || (cur.bonusCredits && cur.bonusCredits[tg.id])) return;
      const a = Number(rec.amount)||0, now = Date.now();
      return Object.assign({},cur,{balance:Number(cur.balance||0)+a,referralEarnings:Number(cur.referralEarnings||0)+a,
        bonusCredits:Object.assign({},cur.bonusCredits||{},{[tg.id]:now}),
        refBonusHistory:Object.assign({},cur.refBonusHistory||{},{[tg.id]:{amount:a,upgradeId:upgradeId,referredName:tg.name||'',fromLevel:up.fromLevel,toLevel:up.toLevel,at:now}})});
    });
    const after = await Store.once('users/'+rec.referrerId);
    if(!(after && after.bonusCredits && after.bonusCredits[tg.id])) return {paid:false,reason:'referrer-missing'};
    await Store.update('referralBonuses/'+tg.id,{status:'paid',paidAt:Date.now()});
    await Store.update('users/'+tg.id,{bonusGiven:true});
    try{ await Store.update('positionUpgrades/'+upgradeId,{bonusStatus:'paid',bonusReferrerId:rec.referrerId,bonusAmount:Number(rec.amount)||0}); }catch(_){}
    await addLog('REFERRAL_BONUS', rec.referrerId+' +'+money0(rec.amount)+' ('+upgradeId+')', true);
    return {paid:true,referrerId:rec.referrerId,amount:Number(rec.amount)||0};
  }catch(e){ console.warn('[refer]',e); return {paid:false,reason:'error'}; }
}

    return { type:'suspend', msg:'আপনার অ্যাকাউন্ট সাসপেন্ড আছে' + (until ? ' (' + until + ' পর্যন্ত)' : '') };

/* ===== JAMANOT UPGRADE — TWO METHODS (user picks one first) =====

            Pay  tax + (new jamanot − previous jamanot).   e.g. 78,200 → 105,500 @15%:  11,730 + 27,300 = 39,030
   'full' — আপগ্রেড করুন: the FULL new jamanot must be in the balance and is deducted; the previous jamanot is credited back
            to the balance (same atomic transaction).     e.g. 78,200 → 105,500: pay 105,500, get 78,200 back (net 27,300)

function ivyR2(n){ return Math.round((Number(n)||0)*100)/100; }

function ivyUpgCalc(mode,p,T,pct,bal){

function ivyUpgWhy(c){

    w==='notax'?'ট্যাক্স হার এখনো নির্ধারিত হয়নি':
    w==='noprev'?'পূর্বের কোনো জামানত নেই — "আপগ্রেড করুন" ব্যবহার করুন':
    w==='notmore'?'এই লেভেলের জন্য ট্যাক্স পদ্ধতি প্রযোজ্য নয়':'অবৈধ টার্গেট লেভেল';

function jxM(n){ n=Number(n)||0; return (Math.abs(n-Math.round(n))<1e-9)?money0(Math.round(n)):money(n); }   /* ৳105,500  /  ৳11,730.50 */
function jxN(n){ n=Number(n)||0; return (Math.abs(n-Math.round(n))<1e-9)?Math.round(n).toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }   /* 105,500 / 11,730.50 — plain number for the arithmetic lines */

/* balance line: enough → "balance − paid (+ refund) = new balance";  not enough → "balance − needed = −shortfall" (red) */
function jxBalEq(c,b){
  if(!c.ok) return jxEq('ব্যালেন্স',jxN(b)+' − '+jxN(c.need),'−'+jxN(ivyR2(c.need-b)),'low');

/* the calculation block of a method (used by BOTH the option card and the confirm screen) */
function jxCalcRows(c,b,withBal){
  let h='';

       jxEq('ট্যাক্স',jxN(c.p)+' × '+jxN(c.pct)+'%',jxN(c.tax))+
       jxEq('মোট দিতে হবে',jxN(c.rem)+' + '+jxN(c.tax),jxM(c.need),'main'+(c.ok?'':' low'));
    if(withBal) h+=jxBalEq(c,b);

function jxSigInit(){

  const pt=e=>{ const r=c.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*c.width/r.width),Math.round((e.clientY-r.top)*c.height/r.height)]; };

/* ===== SINGLE UPGRADE PIPELINE — used by the member's own confirmed upgrade AND the admin's explicit manual upgrade =====
   - two methods (o.mode): 'full' (default) = full NEW jamanot deducted, PREVIOUS jamanot refunded to balance;

async function ivyUpgradeCore(o){
  const uid=o.uid, to=o.to, op=o.op, L=levels(), mode=(o.mode==='tax')?'tax':'full';
  const ti=L.findIndex(l=>l.id===to), T=Number(L[ti]&&L[ti].deposit)||0;

  let pct=null;
  if(mode==='tax'){
    let st=null; try{ st=await Store.once('settings'); }catch(_){}
    pct=ivyTaxPctFor(to,st||STATE.settings);
    if(pct===null) return {ok:false,msg:'ট্যাক্স হার এখনো নির্ধারিত হয়নি'};
  }
  const now=Date.now();
  const ul=await Store.transaction('indexes/upgradeLock/'+uid, cur=>(!cur||Date.now()-Number(cur.ts||0)>60000)?{op,ts:now}:undefined);
  if(!ul.committed) return {ok:false,msg:'অবস্থান আপডেট ইতিমধ্যে প্রসেস হচ্ছে — একটু পরে আবার চেষ্টা করুন'};
  try{
    let fail='', need=T;
    const r=await Store.transaction('users/'+uid, cur=>{
      fail='';
      if(!cur){ fail='missing'; return; }
      if(cur.upgradeOps&&cur.upgradeOps[op]){ fail='dup'; return; }
      if(o.expectFrom && cur.level!==o.expectFrom){ fail='changed'; return; }
      const fi=L.findIndex(l=>l.id===cur.level);
      if(ti<=fi){ fail='level'; return; }
      const b=Number(cur.balance)||0;
      const p=(cur.levelDepositFor===cur.level&&cur.levelDeposit!=null)?(Number(cur.levelDeposit)||0):(Number((L[fi]||{}).deposit)||0);
      const c=ivyUpgCalc(mode,p,T,pct,b);

      if(o.quote && (Math.abs(Number(o.quote.deduct)-c.deduct)>0.004 || Math.abs(Number(o.quote.refund)-c.refund)>0.004)){ fail='quote'; return; }

      if(o.by) rec.by=o.by;
      return Object.assign({},cur,{balance:c.after,level:to,levelCode:to,levelActiveSince:now,levelExpiresAt:now+31536000000,levelDeposit:T,levelDepositFor:to,upgradeOps:Object.assign({},cur.upgradeOps||{},{[op]:rec})});
    });
    let rec=r.committed&&r.value&&r.value.upgradeOps?r.value.upgradeOps[op]:null, again=false;
    if(!rec){
      const cu=await Store.once('users/'+uid);
      if(cu&&cu.upgradeOps&&cu.upgradeOps[op]){ rec=cu.upgradeOps[op]; again=true; }
      else return {ok:false,msg:fail==='balance'?'ব্যালেন্স অপর্যাপ্ত — প্রয়োজন '+money0(need):fail==='level'?'ডাউনগ্রেড বা একই লেভেলে যাওয়া যাবে না':fail==='notax'?'ট্যাক্স হার এখনো নির্ধারিত হয়নি':fail==='noprev'?'পূর্বের কোনো জামানত নেই — "আপগ্রেড করুন" ব্যবহার করুন':fail==='notmore'?'এই লেভেলের জন্য ট্যাক্স পদ্ধতি প্রযোজ্য নয়':fail==='quote'?'হিসাব পরিবর্তিত হয়েছে — আবার দেখে নিশ্চিত করুন':(fail==='changed'||fail==='dup')?'অবস্থান ইতিমধ্যে পরিবর্তিত হয়েছে':'ব্যালেন্স অপর্যাপ্ত বা তথ্য পরিবর্তিত হয়েছে'};
    }
    const h=Object.assign({userId:uid,status:'completed',signatureProvided:!!(o.extra&&o.extra.signatureData)},rec,o.extra||{});
    await Store.transaction('positionUpgrades/'+op,cur=>cur?undefined:h);
    if(!again){ try{ await addLog('UPGRADE', uid+' '+rec.fromLevel+'→'+rec.toLevel+' ['+(rec.mode||'full')+'] কাটা '+money(rec.deductedAmount)+' ফেরত '+money(rec.refundedAmount||0)+' ট্যাক্স '+money(rec.taxAmount||0)+' ('+op+')', true); }catch(_){} }
    let bonus=null;
    if(rec.fromLevel==='M0') bonus=await tryReferralBonus(uid, op);
    try{ await tbOnUpgrade(uid, rec, op); }catch(_e){ console.warn('[tb]',_e); }   /* Treasury coupons / spin grants — admin-set per-level rules only; idempotent per upgrade id */
    return {ok:true,again:again,rec:rec,bonus:bonus};
  }catch(e){ return {ok:false,msg:'সংযোগ সমস্যা — আবার চেষ্টা করুন (দ্বিতীয়বার কাটা হবে না)'}; }
  finally{ try{ await Store.transaction('indexes/upgradeLock/'+uid, cur=>(cur&&cur.op===op)?null:undefined); }catch(_){} }
}
async function jxPosGo(){

  const to=jxTarget, L=levels(), fi=L.findIndex(l=>l.id===u.level), ti=L.findIndex(l=>l.id===to), T=Number(L[ti]&&L[ti].deposit)||0;

  }finally{ STATE.posBusy=false; }
}

/* ---- 365-day position validity (stamped once, never restarted by refresh/relogin) ---- */
async function ivyValidityTick(){
  const u=currentUser(); if(!u || STATE.role!=='user' || IVY.valBusy || !isActiveMember(u)) return;
  const now=Date.now();
  const needStamp = (u.levelCode!==u.level || !u.levelExpiresAt);
  const expired = !needStamp && now>=Number(u.levelExpiresAt);
  if(!needStamp && !expired) return;
  IVY.valBusy=true;
  try{
    await Store.transaction('users/'+u.id, cur=>{
      if(!cur || !isActiveMember(cur)) return;
      if(cur.levelCode!==cur.level || !cur.levelExpiresAt) return Object.assign({},cur,{levelCode:cur.level,levelActiveSince:now,levelExpiresAt:now+365*86400000});
      if(now>=Number(cur.levelExpiresAt)) return Object.assign({},cur,{level:'M0',levelCode:'M0',levelExpired:true,levelExpiredFrom:cur.level,levelExpiredAt:now});
    });
  }catch(e){} finally{ IVY.valBusy=false; }
}

/* ---- team commission, 3-level chain (A = my direct, B = A's direct, C = B's direct) ----
   Rates are admin-set PER RECEIVER POSITION x TIER: settings.teamCommissionRates[<receiver level>][A|B|C] (percent of the earner's task income).
   settings.teamCommissionV===2 marks the new grid; without it the old single "teamCommissionPct" keeps working for tier A only.
   Idempotent ledger: teamCommissions/<day>_<earner>_<taskNo>[_B|_C] (pending -> paid, claimed by a transaction, credited once). */
const TC_TIERS=['A','B','C'];
function ivyTcRate(st,level,tier){
  st=st||{};
  if(st.teamCommissionV===2){ const row=(st.teamCommissionRates||{})[level]; const v=row?Number(row[tier]):0; return v>0?v:0; }
  return tier==='A' ? Math.max(0,Number(st.teamCommissionPct)||0) : 0;
}
async function ivyTcPay(o){
  const key=o.key, rcv=o.receiver, earner=o.earner;
  const claim=await Store.transaction('teamCommissions/'+key, cur=>cur||{id:key,date:o.day,referrerId:rcv.id,referredId:earner.id,referredName:earner.name||'',taskNo:o.taskNo,eligibleIncome:o.income,taskIncome:o.income,commissionRate:o.pct,taskId:o.taskId||null,source:'daily_task',pct:o.pct,amount:o.amt,tier:o.tier,receiverLevel:rcv.level||'',earnerLevel:earner.level||'',status:'pending',createdAt:Date.now()});
  const rec=claim && claim.value; if(!rec || rec.status==='paid') return false;
  const won=await Store.transaction('teamCommissions/'+key, cur=>(cur && cur.status==='pending') ? Object.assign({},cur,{status:'paid',paidAt:Date.now()}) : undefined);
  if(!won.committed) return false;
  await Store.transaction('users/'+rec.referrerId, cur=>{
    if(!cur) return;
    const d=rec.date, a=Number(rec.amount)||0, t=rec.tier||'A';
    const by=Object.assign({},cur.tcByMember||{}), m=by[rec.referredId]||{};
    by[rec.referredId]={d:d,t:ivyR4((m.d===d?Number(m.t||0):0)+a),a:ivyR4(Number(m.a||0)+a),l:t};
    const out={balance:Number(cur.balance||0)+a,tcTotal:ivyR4(Number(cur.tcTotal||0)+a),tcDate:d,tcToday:ivyR4((cur.tcDate===d?Number(cur.tcToday||0):0)+a),tcByMember:by};
    if(t!=='A'){ const lv=Object.assign({},cur.tcLv||{}), l=lv[t]||{}; lv[t]={d:d,t:ivyR4((l.d===d?Number(l.t||0):0)+a),a:ivyR4(Number(l.a||0)+a)}; out.tcLv=lv; }   /* A is derived (tcTotal - B - C) so older totals stay correct */
    const days=Object.assign({},cur.tcDays||{}), dd=Object.assign({},days[d]||{}); dd[t]=ivyR4(Number(dd[t]||0)+a); dd.ts=Date.now(); days[d]=dd;   /* compact per-day history (A/B/C) */
    Object.keys(days).sort().slice(0,-60).forEach(k=>{ delete days[k]; });
    out.tcDays=days;
    return Object.assign({},cur,out);
  });
  return true;
}
async function ivyTeamCommission(u, taskNo, income, day, taskId){
  const st=STATE.settings||{};
  if(st.teamCommissionOn!==true || !(income>0)) return;
  if(!isActiveMember(u) || !u.referredBy) return;
  let cur=u; const seen={}; seen[u.id]=1;
  for(const tier of TC_TIERS){
    if(!cur || !cur.referredBy) break;
    const rid=await Store.once('indexes/referrals/'+String(cur.referredBy));
    if(!rid || seen[rid]) break;
    seen[rid]=1;
    const rcv=await Store.once('users/'+rid);
    if(!rcv) break;
    cur=rcv;                                                   /* the chain follows the referral tree even through an inactive/blocked member */
    if(!isActiveMember(rcv) || rcv.blocked || rcv.suspended) continue;
    const pct=ivyTcRate(st,rcv.level,tier);                    /* receiver's own position decides the rate */
    if(!(pct>0)) continue;
    const amt=ivyR4(income*pct/100); if(!(amt>0)) continue;
    const key=day+'_'+u.id+'_'+taskNo+(tier==='A'?'':'_'+tier);
    try{ await ivyTcPay({key:key,day:day,tier:tier,receiver:Object.assign({id:rid},rcv),earner:u,taskNo:taskNo,income:income,pct:pct,amt:amt,taskId:taskId}); }
    catch(e){ console.warn('[teamCommission '+tier+']',e); }
  }
}
/* referral tree helpers (pure, read STATE.users) */
function ivyKidsMap(){ const m={}; toArray(STATE.users).forEach(x=>{ if(x && x.id && x.referredBy){ (m[x.referredBy]=m[x.referredBy]||[]).push(x); } }); return m; }
function ivyTeamLevels(u,kids){
  kids=kids||ivyKidsMap(); const out={A:[],B:[],C:[],via:{}}, seen={}; seen[u.id]=1; let cur=[u];
  TC_TIERS.forEach(t=>{ const nxt=[];
    cur.forEach(p=>{ if(!p.referralCode) return; (kids[p.referralCode]||[]).forEach(x=>{ if(!seen[x.id]){ seen[x.id]=1; out.via[x.id]=p; out[t].push(x); nxt.push(x); } }); });
    cur=nxt; });
  return out;
}
function ivyTcTierNums(u,t){
  const d=wthDateKey(), lv=u.tcLv||{};
  const one=x=>({today:(x&&x.d===d)?Number(x.t||0):0,total:x?Number(x.a||0):0});
  if(t==='A'){ const b=one(lv.B), c=one(lv.C); return {today:Math.max(0,ivyR4(ivyTc(u)-b.today-c.today)),total:Math.max(0,ivyR4(Number(u.tcTotal||0)-b.total-c.total))}; }
  const o=one(lv[t]); return {today:ivyR4(o.today),total:ivyR4(o.total)};
}

async function ivyTcSave(){

  unsubs.forEach(u=>{ try{ u(); }catch(e){} });
