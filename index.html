  unsubs.push(Store.onValue('paymentProfiles', v=>{ STATE.payProfiles = v||{}; scheduleRender(); }));
  unsubs.push(Store.onValue('paymentNumbers', v=>{ STATE.payNums = v||{}; scheduleRender(); }));
  unsubs.push(Store.onValue('notices', v=>{ STATE.notices = v||{}; scheduleRender(); }));
  unsubs.push(Store.onValue('holidays', v=>{ STATE.holidays = v||{}; scheduleRender(); }));
  unsubs.push(Store.onValue('.info/serverTimeOffset', v=>{ SRV_OFFSET = Number(v)||0; }));

  /* One connection listener only. A disconnect is NOT an empty database. */
  unsubs.push(Store.watchConnection(connected=>{
    STATE.fbConnected = !!connected;
    if(STATE.fbConnected){
      STATE.booted = false;
    }
    scheduleRender();
  }));

  /* Settings is the bootstrap gate. Never seed merely because a transient
     snapshot is null; confirm the path is genuinely empty first. */
  unsubs.push(Store.onValue('settings', v=>{
    STATE.settings = v || {};
    if(v){
      STATE.seedStarted = true;
      STATE.booted = true;
      scheduleRender();
      return;
    }
    if(STATE.fbConnected && !STATE.seedStarted){
      STATE.seedStarted = true;
      (async()=>{
        try{
          const fresh = await Store.once('settings');
          if(!fresh) await seedDefaults();
          else STATE.settings = fresh;
          STATE.booted = true;
          scheduleRender();
        }catch(e){
          STATE.seedStarted = false;
          console.warn('[fb] settings bootstrap failed', e);
        }
      })();
    }
  }));

  /* LIVE user registration / updates -> admin/user UI instantly */
  unsubs.push(Store.onValue('users', v=>{
    STATE.users = v || {};
    const c = Object.keys(STATE.users).length;
    if(prevUserCount !== -1 && c > prevUserCount && STATE.role === 'admin'){
      toast('🟢 নতুন ইউজার লাইভ যোগ হয়েছে!','ok');

    prevUserCount = c;

    if(STATE.userId && STATE.role !== 'admin' && !STATE.users[STATE.userId]){
      STATE.userId = null; clearSession(); STATE.role = 'guest'; STATE.view = 'login';
    }
    if(STATE.userId && STATE.role === 'user') enforceDailyReset();
    if(STATE.role === 'admin') enforceGlobalReset();
    scheduleRender();
  }));

  unsubs.push(Store.onValue('deposits', v=>{
    STATE.deposits = v || {};
    const p = toArray(STATE.deposits).filter(d=>d.status==='pending').length;
    if(prevPendingD !== -1 && p > prevPendingD && STATE.role === 'admin') toast('💰 নতুন ডিপোজিট রিকোয়েস্ট!','warn');
    prevPendingD = p;
    scheduleRender();
  }));

  unsubs.push(Store.onValue('withdrawals', v=>{
    STATE.withdrawals = v || {};
    const p = toArray(STATE.withdrawals).filter(w=>w.status==='pending').length;
    if(prevPendingW !== -1 && p > prevPendingW && STATE.role === 'admin') toast('💸 নতুন উত্তোলন রিকোয়েস্ট!','warn');
    prevPendingW = p;
    scheduleRender();
  }));

  unsubs.push(Store.onValue('auditLogs', v=>{ STATE.logs = v || {}; scheduleRender(); }));
}

/* ---------- 24H TASK CYCLE : ঢাকা রাত ১২:০০ AM রিসেট ---------- */
const resetInFlight = new Set();
async function enforceDailyReset(){
  const u = currentUser();
  if(!u) return;
  const key = wthDateKey();
  if(u.lastTaskDate === key) return;
  if(resetInFlight.has(u.id)) return;
  resetInFlight.add(u.id);
  try{
    await Store.transaction('users/'+u.id, cur=>{ if(!cur || cur.lastTaskDate===key) return; return Object.assign({}, cur, { todayDone:0, lastTaskDate:key, lastTaskDay:wthDayIdx() }); });
    if(STATE.role === 'user') toast('🌙 নতুন দিন — টাস্ক আবার ওপেন হয়েছে!','ok');
  }catch(e){}
  finally{ setTimeout(()=>resetInFlight.delete(u.id), 2000); }
}
async function enforceGlobalReset(){
  const key = wthDateKey();
  const users = Object.values(STATE.users || {});
  for(const u of users){
    if(!u || !u.id) continue;
    if(u.lastTaskDate === key) continue;
    if(resetInFlight.has(u.id)) continue;
    resetInFlight.add(u.id);
    const uid = u.id;
    try{ await Store.transaction('users/'+uid, cur=>{ if(!cur || cur.lastTaskDate===key) return; return Object.assign({}, cur, { todayDone:0, lastTaskDate:key, lastTaskDay:wthDayIdx() }); }); }catch(e){}
    setTimeout(()=>resetInFlight.delete(uid), 2000);
  }
}

async function doRegister(name, phone, pass, refCode){
  phone = String(phone||'').trim();
  refCode = String(refCode||'').trim().toUpperCase();
  if(!/^01\d{9}$/.test(phone)) return {ok:false,msg:'সঠিক ১১ ডিজিট নম্বর দিন'};
  if(!Store || Store.type !== 'firebase' || !STATE.fbConnected) return {ok:false,msg:'Firebase Live সংযোগ প্রস্তুত নয়'};

  if(refCode){
    try{
      const inviterId = await Store.once('indexes/referrals/'+refCode);
      if(!inviterId) return {ok:false,msg:'রেফারেল লিংকটি বৈধ নয়'};
    }catch(e){
      return {ok:false,msg:'রেফারেল তথ্য যাচাই করা যায়নি'};
    }
  }

  // Atomic uniqueness guards prevent two phones/devices registering the same number.
  const phoneKey = phone.replace(/[^0-9]/g,'');
  const phoneClaim = await Store.transaction('indexes/phones/'+phoneKey, cur => cur ? cur : '__RESERVED__');
  if(!phoneClaim.committed && phoneClaim.value !== '__RESERVED__') return {ok:false,msg:'এই নম্বরে অ্যাকাউন্ট আছে'};
  if(phoneClaim.value !== '__RESERVED__') return {ok:false,msg:'এই নম্বরে অ্যাকাউন্ট আছে'};

  let uid = Store.pushKey('users') || genId('U');
  uid = 'U-'+uid.replace(/[^A-Za-z0-9_-]/g,'').slice(-18);
  let rc = 'REF'+Date.now().toString(36).toUpperCase().slice(-6)+Math.floor(Math.random()*90+10);
  const passHash = await hashPass(pass);
  const user = {
    id:uid, name, phone, passHash, myNumber:phone,
    referralCode:rc, referredBy:refCode, balance:Math.max(0,settingNum('registrationBonus',100)), level:'M0', regBonusGiven:true,
    referralEarnings:0, todayDone:0, lastTaskDate:wthDateKey(), lastTaskDay:wthDayIdx(), bonusGiven:false, createdAt:Date.now()
  };

  try{
    await Store.set('users/'+uid, user);
    await Store.set('indexes/phones/'+phoneKey, uid);
    await Store.set('indexes/referrals/'+rc, uid);

    // Referral bonus is intentionally paid only on the first approved deposit,
    // matching the existing admin approval flow and preventing double credit.
    await addLog('USER_REGISTER','নতুন ইউজার (M0): '+phone+' ('+uid+') বোনাস ৳'+settingNum('registrationBonus',100), true);
    return {ok:true,user};
  }catch(e){
    try{ await Store.remove('indexes/phones/'+phoneKey); }catch(_e){}
    try{ await Store.remove('users/'+uid); }catch(_e){}
    return {ok:false,msg:'রেজিস্ট্রেশন সম্পন্ন হয়নি। আবার চেষ্টা করুন'};
  }
}

  let u = null;
  try{
    const uid = await Store.once('indexes/phones/'+phoneKey);
    if(uid) u = await Store.once('users/'+uid);
  }catch(e){
    return { ok:false, msg:'লাইভ ডাটাবেস থেকে তথ্য নেওয়া যায়নি' };
  }
  if(!u) return { ok:false, msg:'ভুল নম্বর বা পাসওয়ার্ড' };
  const h = await hashPass(pass);
  if(h !== u.passHash) return { ok:false, msg:'ভুল নম্বর বা পাসওয়ার্ড' };
  const acct=accountStatus(u); if(acct) return { ok:false, msg:acct.msg };
  /* Reconcile the live snapshot immediately so the UI cannot display an older
     in-memory copy after login. */
  STATE.users = Object.assign({}, STATE.users, {[u.id]:u});
  return { ok:true, user:u };
}

function ivyTaskDays(cur,day,rate,n){ const m=Object.assign({},cur.taskDays||{}), x=m[day]||{}; m[day]={n:n,a:ivyR4(Number(x.a||0)+rate),ts:Date.now()}; Object.keys(m).sort().slice(0,-45).forEach(k=>{ delete m[k]; }); return m; }
function ivyDayStart(day){ return Date.parse(day+'T00:00:00+06:00')||0; }
function ivyDayDiff(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000); }
const HS_TYPES=[['all','সব'],['dep','ডিপোজিট'],['wd','উত্তোলন'],['up','আপগ্রেড'],['task','টাস্ক'],['team','টিম কমিশন'],['bonus','বোনাস'],['ded','কর্তন'],['adm','সমন্বয়']];
const HS_META={dep:['wallet','#0f8a5a','#e7f8ef'],wd:['cash','#d9480f','#fff1e6'],up:['layers','#2f5bff','#eef2ff'],task:['download','#0e8fb0','#e6f7fb'],team:['users','#7c5cf0','#f3efff'],bonus:['gift','#c47a00','#fff6e0'],ded:['shield','#d62839','#ffe9ec'],adm:['lock','#475569','#eef1f6']};
const HS_ST={approved:'সম্পন্ন',paid:'সম্পন্ন',pending:'প্রক্রিয়াধীন',rejected:'বাতিল হয়েছে'};
/* every record that touches a member's money, as one flat list: {k,t,sub,a,sg(+1/-1/0),c(ts),s(status)} */
function ivyHistItems(u,X){
  const it=[], add=(k,t,sub,a,sg,c,s)=>{ a=Number(a)||0; if(a>0) it.push({k:k,t:t,sub:sub||'',a:a,sg:sg,c:Number(c)||0,s:s||''}); };
  toArray(STATE.deposits).filter(d=>d&&d.userId===u.id).forEach(d=>add('dep','ডিপোজিট',[d.method,d.transactionId?('TrxID '+d.transactionId):''].filter(Boolean).join(' • '),d.amount,d.status==='approved'?1:0,d.createdAt,d.status));
  toArray(STATE.withdrawals).filter(w=>w&&w.userId===u.id).forEach(w=>add('wd','উত্তোলন','ফি '+money(w.fee||0)+' • নেট '+money(w.netAmount!=null?w.netAmount:(Number(w.grossAmount||w.amount||0)-Number(w.fee||0))),w.grossAmount!=null?w.grossAmount:w.amount,w.status==='rejected'?0:-1,w.createdAt,w.status));
  Object.values(u.upgradeOps||{}).filter(r=>r&&r.toLevel).forEach(r=>{
    add('up','অবস্থান আপডেট '+r.fromLevel+' → '+r.toLevel,(r.mode==='tax'?'ট্যাক্স পদ্ধতি':'পূর্ণ জামানত'),(r.deductedAmount!=null?Number(r.deductedAmount):Math.abs(Number(r.netChange)||0)),-1,r.timestamp,'approved');
    if(Number(r.refundedAmount)>0) add('up','পূর্বের জামানত ফেরত '+r.fromLevel,'আপডেটের সাথে ফেরত',r.refundedAmount,1,r.timestamp,'approved');
  });
  Object.values(u.refBonusHistory||{}).filter(r=>r&&r.amount).forEach(r=>add('bonus','রেফারেল বোনাস',(r.referredName?r.referredName+' — ':'')+(r.toLevel?(r.fromLevel||'')+' → '+r.toLevel:''),r.amount,1,r.at,'approved'));
  Object.keys(u.bonusLog||{}).map(k=>u.bonusLog[k]).filter(r=>r&&Number(r.amount)>0).forEach(r=>add('bonus',TB_LABEL[r.type]||'বোনাস',r.reason||'',r.amount,1,r.ts,'approved'));
  const days=u.tcDays||{};
  Object.keys(days).forEach(d=>{ const x=days[d]||{}, tot=ivyR4((Number(x.A)||0)+(Number(x.B)||0)+(Number(x.C)||0)); if(!(tot>0)) return;
    add('team','টিম কমিশন',TC_TIERS.filter(t=>Number(x[t])>0).map(t=>t+' স্তর '+moneyC(x[t])).join(' • '),tot,1,x.ts||ivyDayStart(d),'approved'); });
  Object.keys(u.deductLog||{}).map(k=>u.deductLog[k]).filter(r=>r&&Number(r.amount)>0).forEach(r=>add('ded','কর্তন'+(r.reason?' — '+r.reason:''),(r.mode==='daily'?'দৈনিক কিস্তি':'একবারে কর্তন')+(r.by==='admin'?' • এডমিন':''),r.amount,-1,r.ts,'approved'));
  if(X && X.tasks){   /* admin: exact per-task records, grouped per day */
    const g={}; X.tasks.forEach(r=>{ if(!r) return; const d=r.date||ivyDate(r.createdAt); const x=g[d]=g[d]||{n:0,a:0,ts:0}; x.n++; x.a+=Number(r.amount)||0; x.ts=Math.max(x.ts,Number(r.createdAt)||0); });
    Object.keys(g).forEach(d=>add('task','টাস্ক আয় — '+g[d].n+' টি টাস্ক','অবস্থান '+(u.level||''),g[d].a,1,g[d].ts||ivyDayStart(d),'approved'));
  } else {
    Object.keys(u.taskDays||{}).forEach(d=>{ const x=u.taskDays[d]||{}; add('task','টাস্ক আয় — '+(Number(x.n)||0)+' টি টাস্ক','',x.a,1,x.ts||ivyDayStart(d),'approved'); });
  }
  if(X && X.ledger) X.ledger.forEach(r=>{ if(!r) return; const df=Number(r.diff)||0; if(!df) return; add('adm',df>0?'এডমিন ব্যালেন্স যোগ':'এডমিন ব্যালেন্স কাটা','আগে '+money(r.before)+' → পরে '+money(r.after),Math.abs(df),df>0?1:-1,r.createdAt,'approved'); });
  return it.sort((a,b)=>b.c-a.c);
}

function ivyHistoryHTML(u,X,admin){
  const all=ivyHistItems(u,X), f=(STATE.histF&&HS_TYPES.some(t=>t[0]===STATE.histF))?STATE.histF:'all', n=STATE.histN||30;
  const types=HS_TYPES.filter(t=>t[0]==='all'||all.some(x=>x.k===t[0])||t[0]===f);
  const list=f==='all'?all:all.filter(x=>x.k===f), shown=list.slice(0,n);
  const inS=ivyR2(list.reduce((a,x)=>a+(x.sg>0?x.a:0),0)), outS=ivyR2(list.reduce((a,x)=>a+(x.sg<0?x.a:0),0));
  let h='<div class="hs-chips">'+types.map(t=>'<button type="button" class="hs-chip'+(t[0]===f?' on':'')+'" data-ivy="hs-f" data-id="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
    '<div class="hs-sum"><div><b>'+list.length+'</b><span>মোট এন্ট্রি</span></div><div><b style="color:#0f8a5a;">+'+money(inS)+'</b><span>যোগ হয়েছে</span></div><div><b style="color:#d62839;">−'+money(outS)+'</b><span>কাটা হয়েছে</span></div></div>';

/* ---- deduction (কর্তন): one-time or daily instalments; never below zero balance; atomic per member ---- */
/* pure: applies every due instalment to the user object; returns the new object, or null when nothing is due */
function ivyDeductSweep(cur,today,now){
  const plans=cur.deductPlans||{}; let bal=Number(cur.balance)||0, changed=false;
  const np=Object.assign({},plans), log=Object.assign({},cur.deductLog||{});
  Object.keys(plans).sort().forEach(pid=>{ const p=plans[pid]; if(!p||p.status!=='active'||p.lastDay===today) return;
    const days=p.lastDay?ivyDayDiff(p.lastDay,today):1; if(!(days>0)) return;      /* first instalment is taken the day the plan is created */
    const due=ivyR4(Math.min(Number(p.remaining)||0,(Number(p.perDay)||0)*days,Math.max(0,bal)));
    const q=Object.assign({},p,{lastDay:today});
    if(due>0){ bal=ivyR4(bal-due); q.remaining=ivyR4((Number(p.remaining)||0)-due); q.deducted=ivyR4((Number(p.deducted)||0)+due);
      log['D_'+pid+'_'+today]={amount:due,reason:p.reason||'',ts:now,day:today,planId:pid,mode:'daily',by:p.by||'admin'}; }
    if(q.remaining<=0.00005){ q.remaining=0; q.status='done'; q.doneAt=now; }
    np[pid]=q; changed=true; });
  return changed?Object.assign({},cur,{balance:bal,deductPlans:np,deductLog:log}):null;
}
function ivyDedDue(u,today){ return !!u && Object.values(u.deductPlans||{}).some(p=>p&&p.status==='active'&&p.lastDay!==today); }
async function ivyDeductRun(uid){
  const today=wthDateKey(), now=wthNowMs();
  const r=await tbUserTx(uid,cur=>ivyDeductSweep(cur,today,now)||'none');
  return r.ok;
}
async function ivyDeductTick(){

async function ivyDeductAdminSweep(){
  if(STATE.role!=='admin'||IVY.dedBusy||Date.now()-(IVY.dedAt||0)<45000) return;
  const today=wthDateKey(), due=toArray(STATE.users).filter(x=>x&&x.id&&ivyDedDue(x,today)); if(!due.length) return;

}

async function ivyDeductCreate(uid,total,reason,mode,perDay,key){
  total=ivyR2(total); reason=String(reason||'').trim().slice(0,120);
  if(!(total>0)) return {ok:false,msg:'সঠিক পরিমাণ দিন'};
  if(reason.length<2) return {ok:false,msg:'কারণ লিখুন'};
  const today=wthDateKey(), now=wthNowMs();
  let r;
  if(mode==='daily'){
    perDay=ivyR2(perDay);
    if(!(perDay>0)) return {ok:false,msg:'দৈনিক কত টাকা কাটবে সেটি দিন'};
    if(perDay>total) return {ok:false,msg:'দৈনিক পরিমাণ মোট কর্তনের চেয়ে বেশি হতে পারবে না'};
    r=await tbUserTx(uid,cur=>{
      if(cur.deductPlans&&cur.deductPlans[key]) return 'dup';
      const plan={id:key,total:total,perDay:perDay,remaining:total,deducted:0,reason:reason,status:'active',startDay:today,lastDay:'',createdAt:now,by:'admin'};
      const o=Object.assign({},cur,{deductPlans:Object.assign({},cur.deductPlans||{},{[key]:plan})});
      return ivyDeductSweep(o,today,now)||o;
    });
  } else {
    r=await tbUserTx(uid,cur=>{
      const lk='D_'+key; if(cur.deductLog&&cur.deductLog[lk]) return 'dup';
      const bal=Number(cur.balance)||0; if(bal+1e-9<total) return 'bal';
      return Object.assign({},cur,{balance:ivyR4(bal-total),deductLog:Object.assign({},cur.deductLog||{},{[lk]:{amount:total,reason:reason,ts:now,day:today,mode:'once',by:'admin'}})});
    });
  }
  if(!r.ok) return {ok:false,msg:r.fail==='dup'?'এই কর্তন আগেই করা হয়েছে':r.fail==='bal'?'ব্যালেন্স অপর্যাপ্ত — সদস্যের ব্যালেন্সের বেশি একবারে কাটা যাবে না। দৈনিক কিস্তি ব্যবহার করুন বা পরিমাণ কমান':'কর্তন করা যায়নি'};
  await addLog('USER_DEDUCT',uid+' −'+money0(total)+' ('+(mode==='daily'?'দৈনিক '+money0(perDay):'একবারে')+') '+reason,true);
  return {ok:true};
}
async function ivyDeductCancel(uid,pid){
  const r=await tbUserTx(uid,cur=>{ const p=cur.deductPlans&&cur.deductPlans[pid]; if(!p||p.status!=='active') return 'none'; return Object.assign({},cur,{deductPlans:Object.assign({},cur.deductPlans,{[pid]:Object.assign({},p,{status:'cancelled',cancelledAt:wthNowMs()})})}); });
  if(r.ok) await addLog('USER_DEDUCT_CANCEL',uid+' '+pid,true);
  return r.ok;
}

/* ===== NIYOG ADD-ONLY: Customer Care, Group Join, bKash/Nagad 10-min rotation ===== */
const RX = { serverOffset:0, offsetOn:false, subKey:'', unsubs:[], care:{}, careMeta:{}, careOpen:null, draft:'', pendImg:'', tab:'hub', prevTab:'hub', myMeta:{}, gReqs:{}, gFilter:'pending', gShots:{}, gImg:{team:'',account:''}, gBusy:false, ccBusy:false, depSlot:0 };
const ROT_MS = 600000;
function rxNow(){ return Date.now() + (RX.serverOffset||0); }
function rxMMSS(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
/* Global 10-minute window (same for every device). Single active number => no switch. */
function rxRot(m){
  const pool = jxActiveNums(m).filter(p=>p&&p.number);
  if(!pool.length) return null;
  const now = rxNow(), slot = Math.floor(now/ROT_MS);
  return { cur: pool[pool.length>1 ? slot%pool.length : 0], slot, rem: ROT_MS-(now%ROT_MS), multi: pool.length>1 };
}
function rxDepRender(m){
  const el=$('depNums'); if(!el) return;
  const r=rxRot(m);
  if(!r){ RX.depSlot=0; el.innerHTML='<div class="err-line">এই মেথডে এখন কোনো সক্রিয় নম্বর নেই</div>'; return; }
  RX.depSlot=r.slot;
  el.innerHTML='<label class="dw-num"><input type="radio" name="depNum" value="'+esc(r.cur.number)+'" checked><div><small>এডমিন নম্বর • '+esc(m)+'</small><b>'+esc(r.cur.number)+'</b></div><button class="dw-copy" data-action="copy-target" data-text="'+esc(r.cur.number)+'" type="button">Copy</button></label>'+
    '<div class="dw-cd"><div class="bar"><i data-rotbar style="width:'+Math.max(0,Math.min(100,Math.round(r.rem/ROT_MS*100)))+'%"></i></div><span>'+(r.multi?'এই নম্বরটি আরও ':'নম্বর পরিবর্তনের সময়: ')+'<span data-rotcd>'+rxMMSS(r.rem)+'</span>'+(r.multi?' সক্রিয় থাকবে':'')+'</span></div>';
}
setInterval(()=>{
  const dm=$('depM'); if(!dm) return;
  const r=rxRot(dm.value); if(!r) return;
  if(r.slot!==RX.depSlot){ rxDepRender(dm.value); return; }
  document.querySelectorAll('[data-rotcd]').forEach(el=>{ el.textContent=rxMMSS(r.rem); });
  document.querySelectorAll('[data-rotbar]').forEach(el=>{ el.style.width=Math.max(0,Math.min(100,Math.round(r.rem/ROT_MS*100)))+'%'; });
},1000);

/* Subscriptions: admin gets all care meta + group requests; a user gets ONLY own nodes */
function rxSync(){
  if(!Store || Store.type!=='firebase' || !STATE.fbConnected) return;
  if(!RX.offsetOn){ RX.offsetOn=true; RX.unsubs.push(Store.onValue('.info/serverTimeOffset', v=>{ RX.serverOffset=Number(v)||0; })); }
  rxTmSub();
  const u=currentUser();
  const key = STATE.role==='admin' ? 'ADMIN|'+(RX.careOpen||'') : (u ? 'USER|'+u.id : 'NONE');
  if(key===RX.subKey) return;
  RX.subKey=key;
  RX.unsubs.forEach(f=>{ try{ f(); }catch(e){} }); RX.unsubs=[];
  if(STATE.role==='admin'){
    RX.unsubs.push(Store.onValue('ccMeta', v=>{ RX.careMeta=v||{}; scheduleRender(); }));
    RX.unsubs.push(Store.onValue('groupJoinRequests', v=>{ RX.gReqs=v||{}; scheduleRender(); }));
    if(RX.careOpen) RX.unsubs.push(Store.onValue('ccMsgs/'+RX.careOpen, v=>{ RX.care[RX.careOpen]=v||{}; scheduleRender(); }));
  } else if(u){
    RX.myMeta={};
    RX.unsubs.push(Store.onValue('ccMsgs/'+u.id, v=>{ RX.care[u.id]=v||{}; rxRefreshThread(); scheduleRender(); }));
    RX.unsubs.push(Store.onValue('ccMeta/'+u.id, v=>{ RX.myMeta=v||{}; if(STATE.userView==='recruit' && Number(RX.myMeta.unreadUser)>0) Store.update('ccMeta/'+u.id,{unreadUser:0}).catch(()=>{}); scheduleRender(); }));
  }
}

/* ---------- shared chat UI ---------- */
function rxPrevHtml(slot){
  const src = slot==='chat' ? RX.pendImg : RX.gImg[slot];
  return src ? '<div style="position:relative;display:inline-block;margin:4px 0;"><img src="'+esc(src)+'" style="max-height:90px;border-radius:10px;border:1px solid #cbd5e1;display:block;"><button type="button" data-action="rx-clr-img" data-slot="'+slot+'" class="btn danger sm" style="position:absolute;top:-6px;right:-6px;width:auto;padding:2px 7px;">×</button></div>' : '';
}
function rxPaint(slot){ const el=document.getElementById('rxPrev-'+slot); if(el) el.innerHTML=rxPrevHtml(slot); }
function rxPick(inp, slot){
  const f=inp.files&&inp.files[0]; inp.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('শুধু ছবি (image) দিন','err'); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1, 900/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let q=0.7, out=c.toDataURL('image/jpeg',q);
      while(out.length>380000 && q>0.3){ q=Math.round((q-0.1)*10)/10; out=c.toDataURL('image/jpeg',q); }
      if(out.length>380000){ toast('ছবিটি অনেক বড় — ছোট ছবি দিন','err'); return; }
      if(slot==='chat') RX.pendImg=out; else RX.gImg[slot]=out;
      rxPaint(slot);
    };
    im.onerror=()=>toast('ছবি পড়া যায়নি','err');
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function rxBubbles(list, viewer){
  const arr=toArray(list).filter(Boolean).sort((a,b)=>(a.at||0)-(b.at||0));
  if(!arr.length) return '<div class="tiny" style="text-align:center;padding:20px 0;">এখনো কোনো বার্তা নেই</div>';

      '<div style="font-size:10px;color:#64748b;margin-top:3px;text-align:right;">'+esc(timeStr(m.at))+'</div></div></div>';
  }).join('');
}

RX.tmSel = 1; RX.tmEdit = ''; RX.taskMenu = RX.taskMenu || {}; RX.tmOn = false; RX.tmLast = null;
function rxTmSub(){ if(RX.tmOn) return; RX.tmOn=true; Store.onValue('taskMenu', v=>{ RX.taskMenu=v||{}; scheduleRender(); }); }
function rxTmAll(n){
  const o=(RX.taskMenu||{})[String(n)]||{};
  return Object.keys(o).filter(k=>o[k]&&o[k].url).sort().map(k=>Object.assign({id:k},o[k]));
}
function rxHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
/* Stable per user+task: same user, same task => same link on every refresh. One active link => no rotation. */
function rxTmPick(uid,n){
  const pool=rxTmAll(n).filter(x=>x.active).map(x=>x.url);
  if(!pool.length) return '';
  return pool.length===1 ? pool[0] : pool[rxHash(uid+'|'+n)%pool.length];
}
/* Task website opening (add-only). Web page cannot pick a browser itself; uses standard methods only. */
function rxIsEmbedded(){
  const ua=navigator.userAgent||'';
  const inApp=/; wv\)|FBAN|FBAV|Instagram|Line\/|MicroMessenger/i.test(ua);
  const pwa=window.navigator.standalone===true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return inApp||pwa;
}
/* Android: system "open with" chooser (lets user pick a browser). Hidden anchor keeps this page in place. */
function rxIntentUrl(url){
  const x=new URL(url);
  return 'intent://'+x.host+x.pathname+x.search+'#Intent;scheme='+x.protocol.slice(0,-1)+';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
}
function rxOpenExternal(url){
  if(rxIsEmbedded()){
    if(/Android/i.test(navigator.userAgent||'')){
      const a=document.createElement('a'); a.href=rxIntentUrl(url); a.style.display='none';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    showModal('ওয়েবসাইট খুলুন','<div class="hint">এই অ্যাপের ভিতরে ওয়েবসাইট খোলা হবে না। নিচের বাটনে চাপুন এবং ফোনের Browser-এ খুলুন।</div><a class="btn gold" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:10px;text-decoration:none;">ব্রাউজারে খুলুন</a>',[{label:'বন্ধ',cls:'ghost',onClick:dismissModal}]);
    return;
  }
  /* Normal browser tab: new tab of the current browser */
  const w=window.open(url,'_blank');
  if(w){ try{ w.opener=null; }catch(e){} return; }
  showModal('ওয়েবসাইট খুলুন','<div class="hint">ব্রাউজার নতুন ট্যাব খুলতে বাধা দিয়েছে। নিচের বাটনে চাপুন।</div><a class="btn gold" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:10px;text-decoration:none;">ওয়েবসাইট খুলুন</a>',[{label:'বন্ধ',cls:'ghost',onClick:dismissModal}]);
}
function rxTaskVisit(){
  const u=currentUser(); if(!u||STATE.role==='admin') return;
  if(jxHoliday()) return;

  const k=u.id+'|'+n+'|'+today, now=Date.now();

  rxOpenExternal(url);
}

let SRV_OFFSET=0; // Firebase server time offset (ms) — উত্তোলনের সময় Firebase থেকে নেওয়া হয়
function wthNowMs(){ return Date.now()+SRV_OFFSET; }
function wthDateKey(){ return new Date(wthNowMs()+DHAKA_OFFSET).toISOString().slice(0,10); }
function dhakaWeekHour(){ const d=new Date(wthNowMs()+DHAKA_OFFSET); return {day:d.getUTCDay(), mins:d.getUTCHours()*60+d.getUTCMinutes()}; }
function wthScheduleMsg(){
  const t=dhakaWeekHour();
  if(t.day===5||t.day===6) return 'শুক্রবার ও শনিবার সাপ্তাহিক ছুটি। এ দুই দিনে উত্তোলনের আবেদন গ্রহণ করা হয় না। অনুগ্রহ করে রবিবার থেকে বৃহস্পতিবার সকাল ১০টা থেকে বিকাল ৪টার মধ্যে আবেদন করুন।';
  if(t.mins<600) return 'উত্তোলনের আবেদন সকাল ১০টা থেকে গ্রহণ করা হয়। অনুগ্রহ করে সকাল ১০টার পর চেষ্টা করুন।';
  if(t.mins>=960) return 'আজকের উত্তোলনের আবেদনের সময় শেষ হয়েছে (বিকাল ৪টা)। অনুগ্রহ করে পরবর্তী কার্যদিবসে সকাল ১০টা থেকে বিকাল ৪টার মধ্যে আবেদন করুন।';
  return '';
}
/* ক্রম: (১) টাকা কাটা + চার্জ মার্কার, (২) আবেদন সেভ, (৩) মার্কার মোছা।
   আবেদন সেভ না হয়ে যদি কিছু আটকায়, পরবর্তী চেষ্টায় এখানে ফেরত দেওয়া হয়। */
async function wthRecoverPending(uid){
  try{
    const u = await Store.once('users/'+uid);
    const m = u && u.wthPending;
    if(!m || !m.id) return;
    if(wthNowMs() - Number(m.at||0) < 120000) return;
    const w = await Store.once('withdrawals/'+m.id);
    if(w){ await Store.remove('users/'+uid+'/wthPending'); return; }
    await Store.transaction('users/'+uid, cur=>{
      if(!cur || !cur.wthPending || cur.wthPending.id !== m.id) return;
      return Object.assign({}, cur, { balance:Number(cur.balance||0)+Number(m.amt||0), lastWithdrawDay:m.prevDay||'', wthPending:null });
    });
  }catch(e){}
}
/* true = পেন্ডিং আবেদন থাকলেও নতুন আবেদন দেওয়া যাবে; আগের বাধা কোডে রাখা আছে */

async function wthUnlock(uid,wid){ try{ const lp='indexes/withdrawLock/'+uid; const cur=await Store.once(lp); if(cur===wid) await Store.remove(lp); }catch(e){} }
async function wthSyncServerTime(){
  try{ if(Store && Store.type==='firebase'){ const off=await Store.once('.info/serverTimeOffset'); if(typeof off==='number') SRV_OFFSET=off; } }catch(e){}
}

async function wthClearStaleLock(uid){
  try{
    const lockId = await Store.once('indexes/withdrawLock/'+uid);

    if(w && w.status==='pending') return;
    await Store.transaction('indexes/withdrawLock/'+uid, cur=>cur===lockId?null:undefined);
  }catch(e){}
}

        if(!JX_ALLOW_PENDING && toArray(STATE.withdrawals).some(w=>w&&w.userId===me.id&&w.status==='pending')){ err.textContent='আপনার একটি উত্তোলন আবেদন ইতিমধ্যে পেন্ডিং আছে। যাচাই শেষ না হওয়া পর্যন্ত নতুন আবেদন দেওয়া যাবে না।'; return; }

              return Object.assign({}, cur, { balance:Number(cur.balance||0)+Number(cur.wthPending.amt||0), lastWithdrawDay:(cur.wthPending.prevDay||''), wthPending:null });
            }); }catch(e){} }

          if(saved && lockHeld) await wthUnlock(me.id,wid);

        await addLog('WITHDRAW_REQUEST', me.id+' → '+money0(amt-f)+' ('+id+')', true);

let brandTapCount = 0, brandTapTimer = null;

  if(STATE.role === 'admin') return;
  const u = currentUser();
  if(!u) return;
  brandTapCount++;

  }
  else if(act === 'a-nav'){

  }

  else if(act === 'd-filter'){ STATE.adminDFilter = t.dataset.f; render(); }

  else if(act === 'exit-admin' || act === 'admin-logout'){

    render();
  }
  else if(act === 'logout'){
    { const _u = currentUser(); if(_u) await addLog('USER_LOGOUT', _u.id, true); }
    clearSession();
    STATE.userId = null; STATE.role = 'guest'; STATE.view = 'login';
    toast('লগআউট সম্পন্ন','warn');
    render();
  }
  else if(act === 'copy-link'){
    const u = currentUser();
    if(u) copyText(ivyRefLink(u));
  }
  else if(act === 'copy-target'){ copyText(t.dataset.text || ''); }
  else if(act === 'open-deposit'){ jxDeposit(); }
  else if(act === 'open-withdraw'){ openWithdrawDialog(); }

  else if(act === 'do-task'){
    const u = currentUser();
    if(!u) return;
    if(await jxHolidayFresh()){ toast('আজ ছুটি ঘোষণা করা হয়েছে। তাই আজকের দৈনিক কাজ বন্ধ রয়েছে।','warn'); return; }
    await wthSyncServerTime();
    const lv = levelById(u.level), today = wthDateKey(), dayIdx = wthDayIdx();
    let done = Number(u.todayDone||0);
    if(u.lastTaskDate !== today) done = 0;

    if(done >= dailyCap(lv)){
      jxLogAccess(u,'LIMIT_EXCEEDED',done); toast('আজকের সব টাস্ক সম্পন্ন — রাত ১২টার পর আবার আসুন','warn');
      return;
    }
    try{ await Store.transaction('indexes/taskSession/'+u.id+'/'+today, c=>c||{startedAt:Date.now(),level:u.level,cap:dailyCap(lv),device:String(navigator.userAgent||'').slice(0,60)}); }catch(e){ toast('সংযোগ সমস্যা — আবার চেষ্টা করুন','err'); return; }
    const __cap = dailyCap(lv), __ck = 'indexes/taskDay/'+u.id+'/'+today;
    let __ctr;
    try{ __ctr = await Store.transaction(__ck, c=>{ const n=Number(c||0); return n>=__cap ? undefined : n+1; }); }
    catch(e){ toast('সংযোগ সমস্যা — আবার চেষ্টা করুন','err'); return; }
    if(!__ctr.committed){ jxLogAccess(u,'LIMIT_EXCEEDED',Number(__ctr.value)||__cap); toast('আজকের সব টাস্ক সম্পন্ন — রাত ১২টার পর আবার আসুন','warn'); return; }
    const nd = done + 1;
    let taskTx; try{ taskTx = await Store.transaction('users/'+u.id, cur=>{
      if(!cur) return;
      const d = cur.lastTaskDate === today ? Number(cur.todayDone||0) : 0;
      if(d >= dailyCap(lv)) return;
      return Object.assign({}, cur, {
        todayDone:d+1,
        lastTaskDate:today,
        lastTaskDay:dayIdx,
        balance:Number(cur.balance||0)+Number(lv.taskRate||0),
        taskDays:ivyTaskDays(cur,today,Number(lv.taskRate||0),d+1)
      }, (d+1 >= dailyCap(lv)) ? {taskClosedDate:today} : {});
    }); }catch(__e){ taskTx = {committed:false}; }
    if(!taskTx.committed){ try{ await Store.transaction(__ck, c=>{ const n=Number(c||0); return n>0 ? n-1 : n; }); }catch(__r){} jxLogAccess(u,'DUPLICATE_BLOCKED',done); toast('টাস্কটি ইতিমধ্যে সম্পন্ন হয়েছে বা ডাটা আপডেট হয়েছে','warn'); return; }
    const ndC = Number(taskTx.value && taskTx.value.todayDone) || nd, hid = Store.pushKey('taskHistory');
    await addLog('TASK_DONE', u.id+' +৳'+lv.taskRate+' ('+ndC+'/'+lv.dailyTasks+')', true);
    try{ await ivyTeamCommission(u, ndC, Number(lv.taskRate||0), today, hid); }catch(__tc){ console.warn('[teamCommission]',__tc); }
    try{
      await Store.set('taskHistory/'+hid, {
        id:hid, userId:u.id, userName:u.name||'', phone:u.phone||u.myNumber||'',
        level:u.level||'', taskNo:ndC, dailyTasks:Number(lv.dailyTasks||0),
        amount:Number(lv.taskRate||0), date:today, createdAt:wthNowMs()
      });
    }catch(e){ console.warn('[taskHistory]', e); }
    toast('✓ +৳'+lv.taskRate+' যোগ হয়েছে','ok');
  }

  /* ---- ADMIN: withdrawals ---- */
  else if(act === 'adm-app-wth'){
    const w = STATE.withdrawals[id];
    if(!w || w.status !== 'pending') return;
    const tx = await Store.transaction('withdrawals/'+id, cur=>{
      if(!cur || cur.status!=='pending') return;
      return Object.assign({},cur,{status:'approved',approvedAt:Date.now()});

    await wthUnlock(w.userId, id);
    await addLog('WITHDRAW_APPROVED', id+' → '+money0(w.netAmount), true);
    toast('✓ উত্তোলন Approved! (Live)','ok');
  }
  else if(act === 'adm-rej-wth'){
    const w = STATE.withdrawals[id];
    if(!w || w.status !== 'pending') return;
    const tx = await Store.transaction('withdrawals/'+id, cur=>{
      if(!cur || cur.status!=='pending') return;
      return Object.assign({},cur,{status:'rejected',rejectedAt:Date.now()});
    });
    if(!tx.committed){ toast('এই অনুরোধটি ইতিমধ্যে প্রসেস হয়েছে','warn'); return; }
    await Store.transaction('users/'+w.userId, cur=>cur ? Object.assign({},cur,{balance:Number(cur.balance||0)+Number(w.grossAmount||0)}) : cur);
    await wthUnlock(w.userId, id);
    await addLog('WITHDRAW_REJECTED', id+' রিফান্ড '+money0(w.grossAmount), false);
    toast('বাতিল + ব্যালেন্স ফেরত','err');
  }

  /* ---- ADMIN: deposits ---- */
  else if(act === 'adm-app-dep'){
    const d = STATE.deposits[id];
    const rcv = !!d && d.status==='approved' && d.creditMode==='marker' && !d.creditedAt;
    if(!d || (d.status !== 'pending' && !rcv)) return;
    const statusTx = await Store.transaction('deposits/'+id, cur=>{
      if(!cur || cur.status!=='pending') return;
      return Object.assign({},cur,{status:'approved',approvedAt:Date.now(),reviewedAt:Date.now(),reviewedBy:'admin'});
    });
    if(!statusTx.committed && !rcv){ toast('এই ডিপোজিটটি ইতিমধ্যে প্রসেস হয়েছে','warn'); return; }

    const userTx = await Store.transaction('users/'+d.userId, cur=>{
      if(!cur) return;

      const nb = Number(cur.balance||0) + Number(d.amount||0);
      return Object.assign({},cur,{balance:nb},d.creditMode==='marker'?{creditedDeposits:Object.assign({},cur.creditedDeposits||{},{[id]:Date.now()})}:{});
    });
    if(d.creditMode==='marker') await Store.update('deposits/'+id,{creditedAt:Date.now()});
    await addLog('DEPOSIT_APPROVED', money0(d.amount)+' → '+d.userId, true);

  }
  else if(act === 'adm-rej-dep'){

  /* ---- ADMIN: levels ---- */
  else if(act === 'save-levels'){

      const i = parseInt(inp.dataset.lvlI, 10), f = inp.dataset.lvlFld;

      out[i][f] = v;
    });

  /* ---- ADMIN: users ---- */
  else if(act === 'save-user-row'){
    const nm = document.querySelector('input[data-u-name="'+id+'"]');
    const lv = document.querySelector('select[data-u-lvl="'+id+'"]');
    const bl = document.querySelector('input[data-u-bal="'+id+'"]');
    if(!nm) return;
    const cu0 = (STATE.users&&STATE.users[id]) || null;

          if(!res.ok){ toast(res.msg,'err'); return; }
          await addLog('USER_UPDATED', id+' অ্যাডমিন আপগ্রেড '+res.rec.fromLevel+'→'+res.rec.toLevel+' জামানত '+money0(res.rec.deductedAmount)+' ফেরত '+money0(res.rec.refundedAmount||0)+' ('+op+')', true);

      [
        { label:'বাতিল', cls:'ghost', onClick: dismissModal },
        { label:'ডিলিট', cls:'danger', onClick: async ()=>{

/* =========================== STABLE PAINT =========================== */
/* প্রতিটি Live আপডেটে একই পেজ আবার বানানো হতো, ফলে লগইন/পেজে কাঁপুনি দেখা দিত।
   এখন HTML না বদলালে DOM ছোঁয়া হয় না — ইনপুট, অ্যানিমেশন, স্ক্রল সবই স্থির থাকে। */
(function stablePaint(){
  const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  ['topbar','bottomnav','mainContent'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el || el.__stable) return;
    el.__stable = true;
    Object.defineProperty(el, 'innerHTML', {
      configurable: true,
      get(){ return desc.get.call(this); },
      set(v){
        const html = String(v);
        if(this.__lastHtml === html) return;
        this.__lastHtml = html;
        desc.set.call(this, html);
      }
    });
  });
})();

      document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove();

function jxWdMin(){ const v=Number(settingNum('minWithdraw',350)); return v>0 ? v : 350; }
function ivyDayPot(u){ const lv=levelById(u.level)||{}; return Math.max(0,dailyCap(lv)-todayDoneOf(u))*(Number(lv.taskRate)||0); }
function jxWdBuckets(){
  const min = jxWdMin();
  const allowP = (typeof JX_ALLOW_PENDING !== 'undefined') && !!JX_ALLOW_PENDING;
  const holiday = jxHoliday();
  const base = toArray(STATE.users).filter(u=>{
    if(!u || !u.id || !isActiveMember(u)) return false;
    if(u.blocked || u.suspended) return false;
    const bal = Number(u.balance)||0, worked = todayDoneOf(u) > 0;
    if(worked ? bal < min : (bal + ivyDayPot(u)) < min) return false;
    if(u.lastWithdrawDay === wthDateKey()) return false;
    if(!allowP && toArray(STATE.withdrawals).some(w=>w && w.userId===u.id && w.status==='pending')) return false;
    return true;
  }).sort((a,b)=>(Number(b.balance)||0)-(Number(a.balance)||0));
  return {
    holiday: holiday,
    ready: holiday ? [] : base.filter(u=>todayDoneOf(u) > 0),
    waiting: holiday ? [] : base.filter(u=>todayDoneOf(u) <= 0)
  };
}

  h += jxTbl(['অবস্থান','বর্তমান ব্যালেন্স','আজকের বাকি কাজ (সম্ভাব্য)','আগামীকাল সম্ভাব্য ব্যালেন্স','ফোন নাম্বার','নাম','ইউজার ID'],
    rows.map(x=>[esc(x.u.level||'—'),money(Number(x.u.balance)||0),'+'+money(x.add),money(x.proj),esc(x.u.phone||x.u.myNumber||'—'),esc(x.u.name||'—'),esc(x.u.id)]));
  h += '<div style="margin-top:8px;padding:10px 12px;border-radius:12px;background:#eff6ff;font-weight:900;color:#1e3a8a;">আগামীকাল সম্ভাব্য মোট ('+rows.length+' জন): '+money(rows.reduce((s,x)=>s+x.proj,0))+'</div>';
  return h;
}
function jxWdBody(){ return (window.__jxWdMode==='next') ? jxWdNextHtml() : jxWdTodayHtml(); }
function jxWdWrap(h){ return '<div style="max-height:62vh;overflow:auto;">'+h+'</div>'; }
function jxWdShow(){
  const m = window.__jxWdMode || 'today';
  const body = jxWdBody();
  showModal('উত্তোলন লিস্ট', jxWdWrap(body), [
    {label:'আজকের উত্তোলন', cls: m==='today' ? 'gold' : 'ghost', onClick: ()=>{ window.__jxWdMode='today'; jxWdShow(); }},
    {label:'নেক্সট উইথড্র', cls: m==='next' ? 'green' : 'ghost', onClick: ()=>{ window.__jxWdMode='next'; jxWdShow(); }},
    {label:'বন্ধ', cls:'ghost', onClick: dismissModal}
  ]);
  modalBoxEl.__wdBody = m+'|'+body;
}
function jxRefreshWdModal(){
  if(overlayEl.hidden) return;
  const h = modalBoxEl.querySelector('h3');
  if(!h || h.textContent !== 'উত্তোলন লিস্ট') return;
  const m = window.__jxWdMode || 'today';
  const body = jxWdBody();
  const key = m+'|'+body;
  if(modalBoxEl.__wdBody === key) return;
  modalBoxEl.__wdBody = key;
  const holder = modalBoxEl.children[1];
  if(holder) holder.innerHTML = jxWdWrap(body);
}
document.addEventListener('click', e=>{
  if(STATE.role!=='admin') return;
  const b = e.target.closest('[data-action="mem-wd"]');
  if(!b) return;
  window.__jxWdMode = 'today';
  jxWdShow();
});

/* =========================== BOOT =========================== */
(function boot(){
  // No application data is restored from Local Storage. Firebase is the only data source.
  STATE.userId = null;
  STATE.role = 'guest';
  STATE.view = 'login';
  subscribeAll();
  checkVotingFile();
  subscribeVotingCounts();
  render();
  tickCountdown();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW registration failed', e); });
  });
}
</script>
